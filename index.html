function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  draw(g);
  return c;
}

// desenha a partir de um "mapa de pixels" em texto
function fromMap(rows, palette, scale = 1, deco) {
  const h = rows.length, w = rows[0].length;
  return makeSprite(w * scale, h * scale, g => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || !palette[ch]) continue;
      g.fillStyle = palette[ch];
      g.fillRect(x * scale, y * scale, scale, scale);
    }
    if (deco) deco(g, scale);
  });
}

// escurece uma cor hex (para o lado de baixo do bico)
function darken(hex, f = 0.7) {
  if (!hex.startsWith('#')) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return `rgb(${r},${g},${b})`;
}
// pal(corpo, asa, barriga, bico, extras)
function pal(body, wing, belly, beak = '#ff9a2e', extra = {}) {
  return Object.assign({ k: '#1b1b2f', b: body, a: wing, e: belly, w: '#ffffff', p: '#1b1b2f', g: '#1b1b2f', r: beak, d: darken(beak), c: '#ff5e7a' }, extra);
}

// Efeitos de ambiente (partículas simples desenhadas sobre o fundo)
let ambient = [];
let warFlash = 0, warTimer = 0;
function updateAmbient(sc, wind) {
  const fx = sc.fx;
  if (!fx) { ambient = []; return; }
  if (fx === 'snow' && ambient.length < 60) ambient.push({ x: rnd(0, W), y: -4, vx: rnd(-0.3, 0.3), vy: rnd(0.5, 1.1), s: rnd(1, 3), t: rnd(0, 6) });
  if (fx === 'rain' && ambient.length < 90) for (let i = 0; i < 3; i++) ambient.push({ x: rnd(-40, W), y: -8, vx: 1.2, vy: rnd(7, 9), s: 1, t: 0 });
  if (fx === 'embers' && ambient.length < 50 && Math.random() < 0.5) ambient.push({ x: rnd(0, W), y: GROUND_Y + 4, vx: rnd(-0.4, 0.4), vy: rnd(-1.4, -0.6), s: rnd(1, 3), t: rnd(60, 140) });
  if (fx === 'sand' && ambient.length < 40 && Math.random() < 0.4) ambient.push({ x: W + 4, y: rnd(GROUND_Y - 60, GROUND_Y + 30), vx: rnd(-2.5, -1.5), vy: rnd(-0.2, 0.2), s: rnd(1, 2), t: 200 });
  if (fx === 'stars' && ambient.length < 14) ambient.push({ x: rnd(0, W), y: rnd(0, 250), vx: 0, vy: 0, s: 2, t: rnd(20, 60) });
  if (fx === 'war') {
    // clarões de explosão no horizonte e fumaça subindo
    if (--warTimer <= 0) { warTimer = rnd(70, 200); warFlash = 1; ambient.push({ x: rnd(20, W - 20), y: rnd(280, 340), vx: 0, vy: 0, s: 0, t: 18, boom: true }); }
    warFlash = Math.max(0, warFlash - 0.08);
    if (ambient.length < 40 && Math.random() < 0.25) ambient.push({ x: [40, 150, 250][Math.floor(rnd(0, 3))] + rnd(-6, 6), y: 340, vx: rnd(-0.2, 0.2), vy: rnd(-0.8, -0.4), s: rnd(2, 4), t: 120 });
  }
  for (const p of ambient) {
    p.x += p.vx - (fx === 'snow' || fx === 'rain' ? wind * 0.3 : 0); p.y += p.vy; p.t--;
    if (fx === 'snow') p.x += Math.sin(frames / 20 + p.t) * 0.3;
    if (p.boom) p.s = Math.min(16, p.s + 2);
  }
  ambient = ambient.filter(p => p.y < H && p.x > -50 && p.x < W + 50 && (fx === 'snow' || fx === 'rain' ? p.y < GROUND_Y + 6 : p.t > 0));
}
function drawAmbient(sc) {
  const fx = sc.fx; if (!fx) return;
  for (const p of ambient) {
    if (p.boom) {
      ctx.fillStyle = `rgba(255,${200 - p.s * 8},80,${(p.t / 18).toFixed(2)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,200,${(p.t / 36).toFixed(2)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s / 2, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (fx === 'snow') ctx.fillStyle = '#ffffff';
    else if (fx === 'rain') ctx.fillStyle = 'rgba(160,200,255,0.55)';
    else if (fx === 'embers') ctx.fillStyle = p.t % 10 < 5 ? '#ffb040' : '#ff6a20';
    else if (fx === 'sand') ctx.fillStyle = 'rgba(255,230,160,0.7)';
    else if (fx === 'stars') { ctx.fillStyle = `rgba(255,255,255,${(0.4 + 0.6 * Math.abs(Math.sin(p.t / 6))).toFixed(2)})`; }
    else if (fx === 'war') ctx.fillStyle = 'rgba(70,60,55,0.5)';
    if (fx === 'rain') ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 7);
    else ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.s), Math.round(p.s));
  }
  if (fx === 'war' && warFlash > 0) { ctx.fillStyle = `rgba(255,220,160,${(warFlash * 0.35).toFixed(2)})`; ctx.fillRect(0, 0, W, GROUND_Y); }
}

// Confere tudo que ainda não foi pago e paga. Devolve a lista de prêmios novos.
// ---------------------------------------------------------------------------
// Desafios diários: 3 metas sorteadas a partir da data (mesmas o dia todo),
// renovam à meia-noite. Completar as três dá um bônus.
// ---------------------------------------------------------------------------
const DAILY_TYPES = [
  { type: 'runScore',   min: 10, max: 30, text: n => `Faca ${n} pontos em uma partida`,   reward: n => 30 + n * 2 },
  { type: 'runCoins',   min: 4,  max: 8,  text: n => `Pegue ${n} moedas em uma partida`,  reward: n => 30 + n * 6 },
  { type: 'sceneScore', min: 8,  max: 20, text: (n, t) => `Faca ${n} pontos em ${t}`,     reward: n => 40 + n * 2 },
  { type: 'dayPipes',   min: 60, max: 150,text: n => `Passe ${n} canos hoje`,             reward: n => 30 + Math.round(n / 3) },
  { type: 'dayCoins',   min: 15, max: 40, text: n => `Pegue ${n} moedas hoje`,            reward: n => 30 + n * 2 },
  { type: 'games',      min: 5,  max: 10, text: n => `Jogue ${n} partidas hoje`,          reward: n => 20 + n * 4 },
];
const DAILY_BONUS = 150;
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function seededRand(seed) { let r = seed % 2147483647; if (r <= 0) r += 2147483646; return () => (r = r * 16807 % 2147483647) / 2147483647; }
function ensureDaily() {
  const key = todayKey();
  if (save.daily && save.daily.date === key) return;
  let seed = 0; for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rand = seededRand(seed + 7);
  const types = DAILY_TYPES.slice();
  const quests = [];
  for (let i = 0; i < 3; i++) {
    const t = types.splice(Math.floor(rand() * types.length), 1)[0];
    const n = t.min + Math.floor(rand() * (t.max - t.min + 1));
    const q = { type: t.type, n, progress: 0, done: false, reward: t.reward(n) };
    if (t.type === 'sceneScore') {
      const pool = SCENES.filter(sc => save.ownedScenes.includes(sc.id));
      q.target = pool[Math.floor(rand() * pool.length)].id;
    }
    quests.push(q);
  }
  save.daily = { date: key, quests, bonus: false };
  persist();
}
function dailyText(q) {
  const t = DAILY_TYPES.find(d => d.type === q.type);
  const sc = q.target ? SCENES.find(x => x.id === q.target) : null;
  return t.text(q.n, sc ? sc.name : '');
}
// chamada no fim da partida: atualiza progresso e paga o que completou
function updateDaily(won) {
  ensureDaily();
  const d = save.daily;
  for (const q of d.quests) {
    if (q.done) continue;
    switch (q.type) {
      case 'runScore':   q.progress = Math.max(q.progress, score); break;
      case 'runCoins':   q.progress = Math.max(q.progress, runCoins); break;
      case 'sceneScore': if (currentScene().id === q.target) q.progress = Math.max(q.progress, score); break;
      case 'dayPipes':   q.progress += score; break;
      case 'dayCoins':   q.progress += runCoins; break;
      case 'games':      q.progress += 1; break;
    }
    if (q.progress >= q.n) { q.done = true; save.coins += q.reward; won.push({ text: 'Diario: ' + dailyText(q), reward: q.reward }); }
  }
  if (!d.bonus && d.quests.every(q => q.done)) { d.bonus = true; save.coins += DAILY_BONUS; won.push({ text: 'Bonus diario', reward: DAILY_BONUS }); }
}
function dailyDone() { ensureDaily(); return save.daily.quests.filter(q => q.done).length; }
function hoursToMidnight() { const d = new Date(); return Math.max(1, Math.ceil((24 * 60 - d.getHours() * 60 - d.getMinutes()) / 60)); }

function claimQuests() {
  const won = [];
  const claim = (key, text, reward) => { if (save.claimed[key]) return; save.claimed[key] = 1; save.coins += reward; won.push({ text, reward }); };
  for (const b of BIRDS) for (const st of QUEST_STEPS) if ((save.birdBest[b.id] || 0) >= st) claim(`b:${b.id}:${st}`, `${st} pts com ${b.name}`, questReward(st, b.rarity));
  for (const c of SCENES) for (const st of QUEST_STEPS) if ((save.sceneBest[c.id] || 0) >= st) claim(`s:${c.id}:${st}`, `${st} pts em ${c.name}`, questReward(st, c.rarity));
  for (const q of GLOBAL_QUESTS) if (questStat(q.stat) >= q.goal) claim(`g:${q.id}`, q.text, q.reward);
  return won;
}

function medal(x, y, kind) {
  const colors = {

let audioCtx = null;
function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freqFrom, freqTo, dur, type = 'square', vol = 0.12, delay = 0) {
  if (!save.sound) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + delay;
  o.type = type;
  o.frequency.setValueAtTime(freqFrom, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, freqTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, delay = 0) {
  if (!save.sound) return;
  const a = audio(); if (!a) return;
  const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
}
const SFX = {
  wing:  () => tone(500, 900, 0.08, 'square', 0.08),
  point: () => { tone(900, 900, 0.06, 'square', 0.1); tone(1400, 1400, 0.1, 'square', 0.1, 0.06); },
  coin:  () => { tone(1568, 1568, 0.07, 'triangle', 0.12); tone(2093, 2093, 0.18, 'triangle', 0.12, 0.07); },
  buy:   () => { tone(660, 660, 0.08, 'square', 0.1); tone(880, 880, 0.08, 'square', 0.1, 0.08); tone(1320, 1320, 0.16, 'square', 0.1, 0.16); },
  deny:  () => tone(220, 160, 0.18, 'square', 0.1),
  hit:   () => { noise(0.18, 0.25); tone(200, 60, 0.2, 'sawtooth', 0.15); },
  die:   () => tone(400, 80, 0.4, 'square', 0.1, 0.15),
  swoosh:() => noise(0.12, 0.08),

// velocidade dos canos. Nada de arquivos: tudo é sintetizado.

const NOTE = n => n === null ? null : 440 * Math.pow(2, (n - 69) / 12); // MIDI -> Hz
// Melodias próprias, notas MIDI (null = pausa). Cada item é uma colcheia.
const MUSIC = {
  menu: {

    bass: [48,null,null,null,55,null,null,null, 45,null,null,null,52,null,null,null, 41,null,null,null,48,null,null,null, 43,null,null,null,50,null,null,null,
           48,null,null,null,55,null,null,null, 45,null,null,null,52,null,null,null, 41,null,null,null,48,null,null,null, 43,null,43,null,43,null,null,null],
    leadType: 'triangle', leadVol: 0.05, bassVol: 0.05,
  },
  play: {

    lead: [76,79,81,79,76,74,72,74, 76,76,79,81,83,81,79,76, 74,76,79,76,74,72,69,72, 74,76,74,72,74,76,79,null,
           81,79,76,79,81,83,84,83, 81,79,76,74,72,74,76,79, 77,76,74,77,76,74,72,69, 71,72,74,76,74,72,71,null],
    bass: [48,48,55,55,45,45,52,52, 41,41,48,48,43,43,43,43, 48,48,55,55,45,45,52,52, 41,41,48,48,43,43,50,50,
           45,45,52,52,41,41,48,48, 43,43,50,50,55,55,55,55, 41,41,48,48,43,43,50,50, 43,43,43,43,55,55,55,55],
    leadType: 'square', leadVol: 0.035, bassVol: 0.045,
  },
};
const music = { track: null, step: 0, nextTime: 0, timer: null, gain: null };
function musicGain() {
  const a = audio(); if (!a) return null;
  if (!music.gain) { music.gain = a.createGain(); music.gain.gain.value = 1; music.gain.connect(a.destination); }
  return music.gain;
}
function playNote(freq, t, dur, type, vol) {
  const a = audioCtx, g = musicGain(); if (!a || !g || freq === null) return;
  const o = a.createOscillator(), e = a.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(vol, t);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(e); e.connect(g);
  o.start(t); o.stop(t + dur + 0.01);
}
// agenda as próximas colcheias com 120 ms de antecedência (evita engasgos)
function musicTick() {
  const a = audioCtx, tr = MUSIC[music.track];
  if (!a || !tr || !save.music) return;
  const tempo = music.track === 'play' ? tr.bpm * (speed() / PIPE_SPEED) : tr.bpm;
  const stepDur = 60 / tempo / 2;
  while (music.nextTime < a.currentTime + 0.12) {
    const i = music.step % tr.lead.length;
    playNote(NOTE(tr.lead[i]), music.nextTime, stepDur * 0.9, tr.leadType, tr.leadVol);
    playNote(NOTE(tr.bass[i]), music.nextTime, stepDur * 0.8, 'triangle', tr.bassVol);
    music.nextTime += stepDur;
    music.step++;
  }
}
function startMusic(track) {
  if (music.track === track && music.timer) return;
  stopMusic();
  if (!save.music) { music.track = track; return; }     // lembra qual tocar quando ligar
  const a = audio(); if (!a) { music.track = track; return; }
  music.track = track; music.step = 0; music.nextTime = a.currentTime + 0.05;
  music.timer = setInterval(musicTick, 50);
}
function stopMusic() {
  if (music.timer) clearInterval(music.timer);
  music.timer = null;
}
function musicFor(st) {
  return (st === STATE.PLAY || st === STATE.RESUME) ? 'play' : (st === STATE.DEAD || st === STATE.PAUSED) ? null : 'menu';
}
function syncMusic() {
  const want = musicFor(state);
  if (!want) { stopMusic(); music.track = null; return; }
  if (!save.music) { stopMusic(); music.track = want; return; }
  if (music.track !== want || !music.timer) startMusic(want);
}

// ---------------------------------------------------------------------------
// Fogo: sistema de partículas com física
// Cada chama nasce nas costas/cabeça do pássaro e:
//  - herda o movimento do pássaro (inércia) e é arrastada pelo vento
//    contrário ao deslocamento (o mundo corre para a esquerda);
//  - sobe por empuxo (ar quente), com aceleração constante para cima;
//  - perde velocidade horizontal pelo arrasto e treme aleatoriamente;
//  - esfria com o tempo: branco -> amarelo -> laranja -> vermelho -> fumaça,
//    encolhendo até apagar.
// ---------------------------------------------------------------------------
const FIRE_BUOYANCY = -0.045;   // aceleração para cima
const FIRE_DRAG = 0.955;        // atrito horizontal por frame
const FIRE_LIFE = [20, 34];     // duração em frames
const FIRE_MAX = 260;
const FIRE_RISE_MAX = -1.6;     // velocidade máxima de subida (ar quente)

function rnd(a, b) { return a + Math.random() * (b - a); }

// emite chamas a partir de um pássaro (posição, rotação, velocidade vertical)
// wind = velocidade do mundo para a esquerda (0 quando parado)
function emitFire(list, b, wind, rate = 1) {
  const cx = b.x + BIRD_W / 2, cy = b.y + BIRD_H / 2;
  const cos = Math.cos(b.rot), sin = Math.sin(b.rot);
  const spawn = (lx, ly, n, hot) => {
    for (let i = 0; i < n; i++) {
      if (list.length >= FIRE_MAX) return;
      // ponto local (relativo ao centro) girado junto com o pássaro
      const ox = lx + rnd(-2, 2), oy = ly + rnd(-3, 3);
      const x = cx + ox * cos - oy * sin, y = cy + ox * sin + oy * cos;
      list.push({
        x, y,
        vx: -wind * rnd(0.7, 1.0) + rnd(-0.5, 0.5),
        vy: -b.vy * rnd(0.35, 0.6) + rnd(-0.6, 0.1),   // inércia + sopro inicial
        life: rnd(FIRE_LIFE[0], FIRE_LIFE[1]) * (hot ? 1 : 0.7),
        max: 0, size: hot ? rnd(3, 6) : rnd(2, 4),
      });
      list[list.length - 1].max = list[list.length - 1].life;
    }
  };
  spawn(-BIRD_W / 2 + 10, 4, Math.round(4 * rate), true);   // costas
  spawn(-BIRD_W / 2 + 14, -3, Math.round(1 * rate), true);
  spawn(-2, -BIRD_H / 2 + 2, Math.random() < 0.7 * rate ? 1 : 0, false); // topo da cabeça
}

function updateFire(list) {
  for (const p of list) {
    p.vy = Math.max(FIRE_RISE_MAX, p.vy + FIRE_BUOYANCY);
    p.vx *= FIRE_DRAG;
    p.vx += rnd(-0.18, 0.18);          // turbulência
    p.vy += rnd(-0.08, 0.08);
    p.x += p.vx; p.y += p.vy;
    p.life--;
  }
  for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1);
}

const FIRE_COLORS = ['#fff6c0', '#ffd23a', '#ff7a1c', '#d42a10', 'rgba(70,60,60,'];
function drawFire(list, colors = FIRE_COLORS) {
  for (const p of list) {
    const t = p.life / p.max;                 // 1 = recém-nascida, 0 = apagando
    let color, size = Math.max(1, Math.round(p.size * (0.4 + t * 0.8)));
    if (t > 0.8)      color = colors[0];
    else if (t > 0.6) color = colors[1];
    else if (t > 0.4) color = colors[2];
    else if (t > 0.2) color = colors[3];
    else { color = colors[4] + (t * 2.5).toFixed(2) + ')'; size += 1; } // fumaça / brilho final
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(p.x - size / 2), Math.round(p.y - size / 2), size, size);
  }
}

// velocidade atual: fixa até 50 pontos, sobe linearmente até 100 e depois trava
function speed() {
  let v = PIPE_SPEED;
  if (score > SPEED_RAMP_START) {
    const t = Math.min(1, (score - SPEED_RAMP_START) / (SPEED_RAMP_END - SPEED_RAMP_START));
    v = PIPE_SPEED + (PIPE_SPEED_MAX - PIPE_SPEED) * t;
  }
  return slowT > 0 ? v * 0.55 : v;
}

// Sorteia, para cada bloco de 30 canos, 10 posições que terão moeda.
// Assim a média é sempre 10 a cada 30, mas nunca se sabe em qual cano vem.
function rollCoinSlots() {
  const idx = Array.from({ length: PIPES_PER_BLOCK }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  coinSlots = new Set(idx.slice(0, COINS_PER_BLOCK));
}

function spawnPipe(x) {
  const minTop = 60, maxTop = GROUND_Y - PIPE_GAP - 60;
  const top = Math.floor(minTop + Math.random() * (maxTop - minTop));
  if (pipeIndex % PIPES_PER_BLOCK === 0) rollCoinSlots();
  const hasCoin = coinSlots.has(pipeIndex % PIPES_PER_BLOCK);
  let power = null;
  if (!hasCoin && pipeIndex > 2 && pipeIndex - lastPowerPipe >= POWER_MIN_GAP && Math.random() < POWER_CHANCE) {
    const kinds = ['shield', 'magnet', 'slow'];
    power = kinds[Math.floor(Math.random() * kinds.length)];
    lastPowerPipe = pipeIndex;
  }
  pipeIndex++;
  pipes.push({ x, top, passed: false, coin: hasCoin, coinTaken: false, power, powerTaken: false });
}

  if (score > (save.birdBest[bid] || 0)) save.birdBest[bid] = score;
  if (score > (save.sceneBest[sid] || 0)) save.sceneBest[sid] = score;

  save.stats.games++;

}

function input(pt) {
  audio();
  switch (state) {
    case STATE.SPLASH:
      if (inside(pt, BTN_SOUND)) { save.sound = !save.sound; persist(); SFX.swoosh(); break; }
      if (inside(pt, BTN_MUSIC)) { save.music = !save.music; persist(); syncMusic(); SFX.swoosh(); break; }
      if (inside(pt, BTN_SHOP)) goShop(); else if (inside(pt, BTN_RANK)) goRank(); else if (inside(pt, BTN_QUEST)) goQuests(); else goReady();
      break;
    case STATE.QUESTS:
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      for (const t of TAB_Q) if (inside(pt, t)) { questTab = t.id; SFX.swoosh(); }
      break;
    case STATE.RANK:
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      if (inside(pt, TAB_BIRDS))  { rankTab = 'birds';  SFX.swoosh(); }
      if (inside(pt, TAB_SCENES)) { rankTab = 'scenes'; SFX.swoosh(); }
      break;
    case STATE.READY:  goPlay(); break;
    case STATE.PLAY:
      if (inside(pt, BTN_PAUSE)) pauseGame(); else flap();
      break;
    case STATE.PAUSED:
      if (inside(pt, BTN_MENU)) { goSplash(); break; }
      if (!pt || inside(pt, BTN_RESUME)) resumeGame();
      break;
    case STATE.RESUME: break;
    case STATE.DEAD:
      if (deadTimer > 60) goSplash();
      break;
    case STATE.SHOP:
      if (modal) { modalTap(pt); break; }
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      if (inside(pt, TAB_BIRDS))  { shopTab = 'birds';  SFX.swoosh(); break; }
      if (inside(pt, TAB_SCENES)) { shopTab = 'scenes'; SFX.swoosh(); break; }
      if (shopTab === 'birds') {
        for (let i = 0; i < BIRDS.length; i++) if (inside(pt, shopCell(i))) { shopTap(BIRDS[i]); break; }
      } else {
        for (let i = 0; i < SCENES.length; i++) if (inside(pt, sceneCell(i))) { sceneTap(SCENES[i]); break; }
      }
      break;
  }
}
function shopTap(def) {
  if (save.owned.includes(def.id)) { save.selected = def.id; persist(); SFX.swoosh(); shopMsg = null; return; }
  openModal('bird', def);
}
function sceneTap(sc) {
  if (save.ownedScenes.includes(sc.id)) { save.scene = sc.id; persist(); SFX.swoosh(); shopMsg = null; ambient = []; return; }
  openModal('scene', sc);
}
// Abre o popup: com saldo suficiente pede confirmação; sem saldo, avisa quanto falta
function openModal(kind, item) {
  const canBuy = save.coins >= item.price;
  modal = { kind, item, canBuy, t: 0 };
  if (canBuy) SFX.swoosh(); else SFX.deny();
}
function confirmPurchase() {
  const { kind, item } = modal;
  save.coins -= item.price;
  if (kind === 'bird') { save.owned.push(item.id); save.selected = item.id; }
  else { save.ownedScenes.push(item.id); save.scene = item.id; ambient = []; }
  persist(); SFX.buy();
  shopMsg = { text: `${item.name} comprado!`, color: '#7be26a', t: 90 };
  modal = null;
}
function modalTap(pt) {
  if (!pt) { modal = null; return; }
  if (modal.canBuy) {
    if (inside(pt, BTN_BUY)) confirmPurchase();
    else if (inside(pt, BTN_CANCEL) || !inside(pt, MODAL)) { modal = null; SFX.swoosh(); }
  } else if (inside(pt, BTN_MODAL_OK) || !inside(pt, MODAL)) { modal = null; SFX.swoosh(); }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); input(null); }
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (modal) modal = null;
    else if (state === STATE.PLAY) pauseGame();
    else if (state === STATE.PAUSED) resumeGame();
    else if (state === STATE.SHOP || state === STATE.RANK || state === STATE.QUESTS) goSplash();
  }
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  input({ x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height });
});
window.addEventListener('contextmenu', e => e.preventDefault());

// Atualização
// ---------------------------------------------------------------------------
function birdBox() { return { x: bird.x + 12, y: bird.y + 8, w: BIRD_W - 18, h: BIRD_H - 14 }; }

// devolve 'ground', 'pipe' ou null
function collides() {
  const b = birdBox();
  if (b.y + b.h >= GROUND_Y) return 'ground';
  for (const p of pipes) {
    if (b.x + b.w > p.x && b.x < p.x + PIPE_W) {
      if (b.y < p.top || b.y + b.h > p.top + PIPE_GAP) return 'pipe';
    }
  }
  return null;
}

function coinPos(p) { const o = p.coinOff || { x: 0, y: 0 }; return { x: p.x + PIPE_W / 2 + o.x, y: p.top + PIPE_GAP / 2 + o.y }; }

// ---------------------------------------------------------------------------
// Power-ups: aparecem no vão de alguns canos (nunca junto com moeda).
//  escudo  - aguenta uma batida em cano
//  ima     - por 8 s as moedas próximas são puxadas para o pássaro
//  lento   - por 5 s canos e chão andam a 55% da velocidade
// ---------------------------------------------------------------------------
const POWER = {
  shield: { name: 'ESCUDO', color: '#4aa8ff', light: '#c8e8ff', dur: 0 },
  magnet: { name: 'IMA',    color: '#e84040', light: '#ffc0b0', dur: 480 },
  slow:   { name: 'LENTO',  color: '#b070e8', light: '#e8d0ff', dur: 300 },
};
const POWER_MIN_GAP = 8;        // canos mínimos entre dois power-ups
const POWER_CHANCE = 1 / 10;    // chance por cano elegível
let shieldOn = false, invuln = 0, magnetT = 0, slowT = 0, lastPowerPipe = -99;

function drawPowerIcon(x, y, type, r = 9) {
  const c = POWER[type];
  ctx.fillStyle = '#543847'; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = c.light;
  if (type === 'shield') { ctx.fillRect(x - 4, y - 5, 8, 6); ctx.fillRect(x - 3, y + 1, 6, 2); ctx.fillRect(x - 2, y + 3, 4, 2); ctx.fillStyle = c.color; ctx.fillRect(x - 1, y - 3, 2, 5); }
  if (type === 'magnet') { ctx.fillRect(x - 5, y - 5, 3, 7); ctx.fillRect(x + 2, y - 5, 3, 7); ctx.fillRect(x - 5, y + 2, 10, 3); ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 5, y - 5, 3, 2); ctx.fillRect(x + 2, y - 5, 3, 2); }
  if (type === 'slow') { ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = c.color; ctx.fillRect(x - 1, y - 4, 2, 5); ctx.fillRect(x, y - 1, 4, 2); }
}

function collectPowers() {
  const b = birdBox();
  for (const p of pipes) {
    if (!p.power || p.powerTaken) continue;
    const c = coinPos(p);
    const nx = Math.max(b.x, Math.min(c.x, b.x + b.w)), ny = Math.max(b.y, Math.min(c.y, b.y + b.h));
    if ((nx - c.x) ** 2 + (ny - c.y) ** 2 <= 11 * 11) {
      p.powerTaken = true;
      if (p.power === 'shield') shieldOn = true;
      if (p.power === 'magnet') magnetT = POWER.magnet.dur;
      if (p.power === 'slow') slowT = POWER.slow.dur;
      popups.push({ x: c.x, y: c.y, t: 50, text: POWER[p.power].name, color: POWER[p.power].light });
      for (let i = 0; i < 10; i++) sparks.push({ x: c.x, y: c.y, vx: rnd(-2.5, 2.5), vy: rnd(-2.5, 1), t: rnd(14, 26), color: POWER[p.power].color });
      SFX.buy();
    }
  }
}

// ímã: puxa as moedas próximas
function applyMagnet() {
  if (magnetT <= 0) return;
  const bx = bird.x + BIRD_W / 2, by = bird.y + BIRD_H / 2;
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    if (p.coinOff === undefined) p.coinOff = { x: 0, y: 0 };
    const c = coinPos(p), dx = bx - c.x, dy = by - c.y, d = Math.hypot(dx, dy);
    if (d < 110 && d > 1) { p.coinOff.x += dx / d * 4.5; p.coinOff.y += dy / d * 4.5; }
  }
}

function collectCoins() {
  const b = birdBox();
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    const nx = Math.max(b.x, Math.min(c.x, b.x + b.w)), ny = Math.max(b.y, Math.min(c.y, b.y + b.h));
    if ((nx - c.x) ** 2 + (ny - c.y) ** 2 <= COIN_R * COIN_R) {
      p.coinTaken = true; runCoins++; save.coins++; save.stats.totalCoins++;
      for (let i = 0; i < 8; i++) sparks.push({ x: c.x, y: c.y, vx: rnd(-2.2, 2.2), vy: rnd(-2.6, 0.6), t: rnd(14, 26) });
      popups.push({ x: c.x, y: c.y, t: 40 });
      SFX.coin();
    }
  }
}

function updateBirdPhysics() {
  bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
  bird.y += bird.vy;
  if (bird.y < -BIRD_H) { bird.y = -BIRD_H; bird.vy = 0; }
  if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
  const target = bird.vy < 0 ? -0.45 : Math.min(Math.PI / 2, (bird.vy - 1) * 0.22);
  bird.rot = bird.vy < 0 ? target : Math.min(target, bird.rot + 0.06);
  if (bird.vy < 0) bird.rot = -0.45;
}

function animateBird(speed) {
  bird.animT++;
  if (bird.animT >= speed) { bird.animT = 0; bird.frame = (bird.frame + 1) % 4; }
}

function update() {
  frames++;
  for (const q of popups) { q.t--; q.y -= 0.6; }
  popups = popups.filter(q => q.t > 0);
  if (shopMsg && --shopMsg.t <= 0) shopMsg = null;
  if (modal) modal.t++;
  if (shake > 0) shake--;
  for (const q of sparks) { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.t--; }
  sparks = sparks.filter(q => q.t > 0);
  if (frames % 15 === 0) syncMusic();
  if (state === STATE.RESUME && --resumeTimer <= 0) state = STATE.PLAY;

  // fogo do pássaro em uso (em todas as telas onde ele aparece)
  if (currentBird().fire && state !== STATE.SHOP && state !== STATE.RANK && state !== STATE.QUESTS && state !== STATE.PAUSED) {
    const wind = state === STATE.PLAY ? speed() : state === STATE.DEAD ? 0 : PIPE_SPEED;
    const onGround = state === STATE.DEAD && bird.y >= GROUND_Y - BIRD_H;
    emitFire(fire, bird, wind, onGround ? 0.6 : 1);
  }
  updateFire(fire);
  if (state !== STATE.PAUSED) updateAmbient(currentScene(), state === STATE.PLAY ? speed() : (state === STATE.DEAD || state === STATE.RESUME) ? 0 : PIPE_SPEED);
  // prévia da loja
  if (state === STATE.SHOP) {
    // cada pássaro com fogo tem a própria lista de partículas na prévia
    BIRDS.forEach((b, i) => {
      if (!b.fire) return;
      if (!b.shopFire) b.shopFire = [];
      const r = shopCell(i);
      const pb = { x: r.x + r.w / 2 - BIRD_W / 2, y: r.y + 10, rot: 0, vy: 0 };
      emitFire(b.shopFire, pb, 0.6, 0.5);
      updateFire(b.shopFire);
    });
  } else for (const b of BIRDS) b.shopFire = [];

  switch (state) {
    case STATE.SPLASH:
    case STATE.READY:
    case STATE.SHOP:
    case STATE.RANK:
    case STATE.QUESTS:
      groundX = (groundX - PIPE_SPEED) % GROUND_TILE_W;
      bird.y = 214 + Math.sin(frames / 8) * 5;
      bird.rot = 0;
      animateBird(6);
      break;

    case STATE.PLAY: {
      const v = speed();
      groundX = (groundX - v) % GROUND_TILE_W;
      animateBird(4);
      updateBirdPhysics();
      for (const p of pipes) {
        p.x -= v;
        if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; save.stats.totalPipes++; SFX.point(); }
      }
      if (pipes.length && pipes[0].x < -PIPE_CAP_W) pipes.shift();
      if (pipes[pipes.length - 1].x <= W - PIPE_SPACING + PIPE_W) spawnPipe(pipes[pipes.length - 1].x + PIPE_SPACING);
      collectPowers();
      applyMagnet();
      collectCoins();
      if (magnetT > 0) magnetT--;
      if (slowT > 0) slowT--;
      if (invuln > 0) invuln--;
      const hit = collides();
      if (hit === 'ground') die();
      else if (hit === 'pipe' && invuln <= 0) {
        if (shieldOn) { shieldOn = false; invuln = 40; shake = 8; SFX.deny(); popups.push({ x: bird.x + BIRD_W, y: bird.y, t: 40, text: 'ESCUDO!', color: '#c8e8ff' }); }
        else die();
      }
      break;
    }

    case STATE.DEAD:
      deadTimer++;
      flashAlpha = Math.max(0, flashAlpha - 0.08);
      if (bird.y < GROUND_Y - BIRD_H) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL);
        bird.y += bird.vy;
        if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
        bird.rot = Math.min(Math.PI / 2, bird.rot + 0.12);
      }
      if (deadTimer > 30) panelY = Math.max(H / 2 - (questTotal > 0 ? 140 : 130), panelY - 14);
      break;
  }
}

function drawPipes() {
  const { body, cap } = sceneAssets(currentScene()).pipes;
  for (const p of pipes) {
    const x = Math.round(p.x);
    const th = body.height;
    for (let y = p.top - PIPE_CAP_H - th; y > -th; y -= th) ctx.drawImage(body, x, y);
    ctx.drawImage(cap, x - 2, p.top - PIPE_CAP_H);
    const bottom = p.top + PIPE_GAP;
    ctx.drawImage(cap, x - 2, bottom);
    for (let y = bottom + PIPE_CAP_H; y < GROUND_Y; y += th) { const h = Math.min(th, GROUND_Y - y); ctx.drawImage(body, 0, 0, PIPE_W, h, x, y, PIPE_W, h); }
  }
}

function drawCoin(x, y, big = false, spin = false) {
  const f = spin ? COIN_FRAMES[Math.floor(frames / 6) % 4] : COIN_FRAMES[0];
  if (big) ctx.drawImage(f, Math.round(x - 8), Math.round(y - 8));
  else ctx.drawImage(f, 0, 0, 16, 16, Math.round(x - 6), Math.round(y - 6), 12, 12);
}

function drawCoins() {
  for (const p of pipes) {
    if (p.power && !p.powerTaken) {
      const c = coinPos(p), pulse = 1 + Math.sin(frames / 6) * 0.15;
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(c.x, c.y, 15 * pulse, 0, Math.PI * 2); ctx.fill();
      drawPowerIcon(c.x, c.y + Math.sin(frames / 10) * 2, p.power, 10);
    }
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    drawCoin(c.x, c.y + Math.sin(frames / 10) * 2, true, true);
  }
  for (const q of popups) pixelText(q.text || '+1', q.x, q.y - 14, 11, q.color || '#ffe060', '#543847');
}

function drawBird(def = currentBird(), b = bird) {
  const f = [0, 1, 2, 1][b.frame];
  if (def.fire) drawFire(b === bird ? fire : (def.shopFire || []), def.fireColors);
  if (b === bird && (shieldOn || invuln > 0)) {
    const cx = b.x + BIRD_W / 2, cy = b.y + BIRD_H / 2, r = 22 + Math.sin(frames / 5) * 1.5;
    ctx.fillStyle = shieldOn ? 'rgba(74,168,255,0.25)' : `rgba(255,255,255,${(invuln % 8 < 4 ? 0.25 : 0.05).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = shieldOn ? '#c8e8ff' : '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.save();
  ctx.translate(Math.round(b.x + BIRD_W / 2), Math.round(b.y + BIRD_H / 2));
  ctx.rotate(b.rot);
  ctx.drawImage(birdSprite(def, f), -BIRD_W / 2, -BIRD_H / 2);
  ctx.restore();
}

function drawGround() { ctx.drawImage(sceneAssets(currentScene()).ground, Math.round(groundX), GROUND_Y); }

function drawTapHint(x, y) {

      ctx.fillStyle = '#543847'; ctx.fillRect(px + 30, y + 14, 120, 6);
      ctx.fillStyle = done ? '#4cc07a' : '#f5a623'; ctx.fillRect(px + 31, y + 15, Math.round(118 * cur / q.goal), 4);
      pixelText(`${cur}/${q.goal}`, px + 156, y + 11, 8, '#543847', '#f5f0c0', 'left');
      drawCoin(px + pw - 42, y + 9, false);
      pixelText(String(q.reward), px + pw - 34, y + 3, 10, done ? '#3a9a2a' : '#7a5200', '#f5f0c0', 'left');
    });
    return;
  }

  const isBirds = questTab === 'birds';
  const list = isBirds ? BIRDS : SCENES, table = isBirds ? save.birdBest : save.sceneBest, pre = isBirds ? 'b:' : 's:';
  const rowH = 20;
  panel(px, y0 - 6, pw, list.length * rowH + 12);
  list.forEach((it, i) => {
    const y = y0 + i * rowH, rec = table[it.id] || 0;
    const owned = isBirds ? save.owned.includes(it.id) : save.ownedScenes.includes(it.id);
    if (i % 2) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(px + 6, y - 2, pw - 12, rowH); }
    if (isBirds) {
      ctx.save(); ctx.globalAlpha = owned ? 1 : 0.45;
      ctx.drawImage(birdSprite(it, 1), 0, 0, BIRD_W, BIRD_H, px + 8, y - 2, 26, 18);
      ctx.restore();
    } else {
      const a = sceneAssets(it);
      ctx.fillStyle = '#543847'; ctx.fillRect(px + 9, y - 2, 28, 18);
      ctx.drawImage(a.bg, 0, 100, W, GROUND_Y - 100, px + 10, y - 1, 26, 12);
      ctx.drawImage(a.ground, 0, 0, W, 30, px + 10, y + 11, 26, 4);
      if (!owned) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(px + 10, y - 1, 26, 16); }
    }
    pixelText(it.name, px + 42, y - 3, 9, owned ? '#543847' : '#8a8070', '#f5f0c0', 'left');
    // escada de metas: um quadradinho por degrau (verde = pago, laranja = próximo)
    let next = null;
    QUEST_STEPS.forEach((st, k) => {
      const done = !!save.claimed[`${pre}${it.id}:${st}`];
      if (!done && next === null) next = st;
      const x = px + 42 + k * 15;
      ctx.fillStyle = '#543847'; ctx.fillRect(x, y + 8, 12, 7);
      ctx.fillStyle = done ? '#4cc07a' : (st === next ? '#f5a623' : '#e8e0c0'); ctx.fillRect(x + 1, y + 9, 10, 5);
    });
    if (next === null) pixelText('COMPLETO', px + pw - 10, y + 2, 9, '#3a9a2a', '#f5f0c0', 'right');
    else {
      pixelText(`${next} pts`, px + pw - 48, y - 3, 9, '#543847', '#f5f0c0', 'right');
      drawCoin(px + pw - 44, y + 12, false);
      pixelText(String(questReward(next, it.rarity)), px + pw - 36, y + 7, 9, '#7a5200', '#f5f0c0', 'left');
    }
  });
  pixelText('Cada meta paga uma vez e nunca reinicia', W / 2, H - 22, 9, '#ffffff', '#543847');
}

function drawRank() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  drawButton(BTN_BACK, 'VOLTAR', '#6aa8ff', '#a8ccff', '#3a70c0', 11);
  pixelText('RANKING', W / 2, 8, 22, '#ffffff', '#543847');
  const on = ['#b070e8', '#d8b0ff', '#7a40b0'], off = ['#8a7a60', '#a89880', '#5a4e3c'];
  drawButton(TAB_BIRDS,  'PASSAROS', ...(rankTab === 'birds'  ? on : off), 10);
  drawButton(TAB_SCENES, 'CENARIOS', ...(rankTab === 'scenes' ? on : off), 10);

  const isBirds = rankTab === 'birds';
  const table = isBirds ? save.birdBest : save.sceneBest;
  const items = (isBirds ? BIRDS : SCENES).map(it => ({ it, rec: table[it.id] || 0 }))
    .sort((a, b) => b.rec - a.rec || (isBirds ? BIRDS : SCENES).indexOf(a.it) - (isBirds ? BIRDS : SCENES).indexOf(b.it));

  const px = 8, pw = W - 16;
  panel(px, RANK_Y0 - 6, pw, items.length * RANK_ROW_H + 12);
  items.forEach(({ it, rec }, i) => {
    const y = RANK_Y0 + i * RANK_ROW_H;
    const owned = isBirds ? save.owned.includes(it.id) : save.ownedScenes.includes(it.id);
    if (i % 2) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(px + 6, y - 2, pw - 12, RANK_ROW_H); }
    // posição
    pixelText(String(i + 1) + '.', px + 12, y + 2, 9, i < 3 ? '#f5a623' : '#543847', '#f5f0c0', 'left');
    // ícone
    if (isBirds) {
      ctx.save(); ctx.globalAlpha = owned ? 1 : 0.45;
      ctx.drawImage(birdSprite(it, 1), 0, 0, BIRD_W, BIRD_H, px + 28, y - 2, 26, 18);
      ctx.restore();
    } else {
      const a = sceneAssets(it);
      ctx.fillStyle = '#543847'; ctx.fillRect(px + 29, y - 2, 28, 18);
      ctx.drawImage(a.bg, 0, 100, W, GROUND_Y - 100, px + 30, y - 1, 26, 12);
      ctx.drawImage(a.ground, 0, 0, W, 30, px + 30, y + 11, 26, 4);
      if (!owned) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(px + 30, y - 1, 26, 16); }
    }
    pixelText(it.name, px + 62, y + 2, 10, owned ? '#543847' : '#8a8070', '#f5f0c0', 'left');
    // recorde e estrelas
    drawNumber(rec, px + pw - 58, y + 1, smallDigits, SMALL_DW, 'right');
    drawStars(px + pw - 52, y + 3, starsFor(rec));
  });
  pixelText(`Estrelas: ${STAR_STEPS.join(' / ')} pontos`, W / 2, H - 22, 9, '#ffffff', '#543847');
}

function drawModal() {
  const { kind, item, canBuy } = modal;
  const k = Math.min(1, modal.t / 8);                 // entrada: cresce de 80% a 100%
  ctx.fillStyle = `rgba(0,0,0,${(0.55 * k).toFixed(2)})`; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, MODAL.y + MODAL.h / 2); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k); ctx.translate(-W / 2, -(MODAL.y + MODAL.h / 2));
  panel(MODAL.x, MODAL.y, MODAL.w, MODAL.h);
  const rar = RARITY[item.rarity];
  pixelText(canBuy ? 'CONFIRMAR COMPRA' : 'MOEDAS INSUFICIENTES', W / 2, MODAL.y + 12, 12, canBuy ? '#f5a623' : '#ff6060', '#543847');

  // prévia do item
  const py = MODAL.y + 36;
  if (kind === 'bird') {
    ctx.fillStyle = '#543847'; ctx.fillRect(W / 2 - 32, py, 64, 44);
    ctx.fillStyle = '#4ec0ca'; ctx.fillRect(W / 2 - 30, py + 2, 60, 40);
    ctx.drawImage(birdSprite(item, [0, 1, 2, 1][bird.frame]), W / 2 - BIRD_W / 2, py + 4);
  } else {
    const a = sceneAssets(item);
    ctx.fillStyle = '#543847'; ctx.fillRect(W / 2 - 40, py, 80, 44);
    ctx.drawImage(a.bg, 0, 100, W, GROUND_Y - 100, W / 2 - 38, py + 2, 76, 32);
    ctx.drawImage(a.ground, 0, 0, W, 30, W / 2 - 38, py + 34, 76, 8);
  }
  pixelText(item.name, W / 2, py + 50, 13, '#543847', '#f5f0c0');
  pixelText(rar.label, W / 2, py + 68, 8, rar.color, '#543847');

  // preço e saldo
  const ly = py + 84;
  drawCoin(W / 2 - 46, ly + 7, true);
  pixelText('Preco: ' + item.price, W / 2 - 34, ly, 11, '#543847', '#f5f0c0', 'left');
  if (canBuy) pixelText(`Sobram ${save.coins - item.price} moedas`, W / 2, ly + 18, 9, '#3a9a2a', '#f5f0c0');
  else pixelText(`Faltam ${item.price - save.coins} moedas`, W / 2, ly + 18, 9, '#d02020', '#f5f0c0');

  if (canBuy) {
    drawButton(BTN_BUY, 'COMPRAR', '#4cc07a', '#9ae8b4', '#2a8a4e', 12);
    drawButton(BTN_CANCEL, 'CANCELAR', '#e05a4a', '#ffa090', '#a03020', 12);
  } else {
    drawButton(BTN_MODAL_OK, 'OK', '#6aa8ff', '#a8ccff', '#3a70c0', 12);
  }
  ctx.restore();
}

function drawShop() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  drawButton(BTN_BACK, 'VOLTAR', '#6aa8ff', '#a8ccff', '#3a70c0', 11);
  pixelText('LOJA', W / 2, 8, 22, '#ffffff', '#543847');
  drawCoinHud(W - 74, 14, save.coins);
  const on = ['#f5a623', '#fbd36b', '#c47e12'], off = ['#8a7a60', '#a89880', '#5a4e3c'];
  drawButton(TAB_BIRDS,  'PASSAROS', ...(shopTab === 'birds'  ? on : off), 10);
  drawButton(TAB_SCENES, 'CENARIOS', ...(shopTab === 'scenes' ? on : off), 10);

  if (shopTab === 'scenes') { drawSceneShop(); drawShopOverlay(); return; }
  for (let i = 0; i < BIRDS.length; i++) {
    const def = BIRDS[i], r = shopCell(i), rar = RARITY[def.rarity];
    const owned = save.owned.includes(def.id), sel = save.selected === def.id;
    // moldura na cor da raridade; selecionado ganha borda branca
    ctx.fillStyle = sel ? '#ffffff' : '#543847'; ctx.fillRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    ctx.fillStyle = rar.color; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = owned ? '#f5f0c0' : '#ded895'; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
    pixelText(rar.label, r.x + r.w / 2, r.y + 3, 8, rar.color, '#543847');
    const preview = { x: r.x + r.w / 2 - BIRD_W / 2, y: r.y + 10 + (sel ? Math.sin(frames / 8) * 2 : 0), rot: 0, frame: bird.frame };
    if (!owned) ctx.globalAlpha = 0.55;
    drawBird(def, preview);
    ctx.globalAlpha = 1;
    pixelText(def.name, r.x + r.w / 2, r.y + 44, 9, '#543847', '#f5f0c0');
    drawStars(r.x + r.w / 2 - 20, r.y + 54, starsFor(save.birdBest[def.id] || 0), 8);
    if (sel) pixelText('EM USO', r.x + r.w / 2, r.y + 63, 8, '#ffffff', '#3a9a2a');
    else if (owned) pixelText('USAR', r.x + r.w / 2, r.y + 63, 8, '#ffffff', '#543847');
    else {
      drawCoin(r.x + r.w / 2 - 14, r.y + 68, false);
      pixelText(String(def.price), r.x + r.w / 2 - 6, r.y + 63, 9, save.coins >= def.price ? '#ffe060' : '#ff9090', '#543847', 'left');
    }
  }
  drawShopOverlay();
}

// mensagem de rodapé e popup de compra, por cima de qualquer aba da loja
function drawShopOverlay() {
  pixelText('Pegue moedas nos canos para comprar', W / 2, H - 22, 9, '#ffffff', '#543847');
  if (shopMsg) {
    ctx.globalAlpha = Math.min(1, shopMsg.t / 20);
    pixelText(shopMsg.text, W / 2, H - 42, 13, shopMsg.color, '#543847');
    ctx.globalAlpha = 1;
  }
  if (modal) drawModal();
}

function drawSoundButtons() {
  drawButton(BTN_SOUND, '', save.sound ? '#6aa8ff' : '#8a7a60', save.sound ? '#a8ccff' : '#a89880', save.sound ? '#3a70c0' : '#5a4e3c');
  drawButton(BTN_MUSIC, '', save.music ? '#6aa8ff' : '#8a7a60', save.music ? '#a8ccff' : '#a89880', save.music ? '#3a70c0' : '#5a4e3c');
  // alto-falante
  let x = BTN_SOUND.x + 7, y = BTN_SOUND.y + 8;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y + 3, 3, 4); ctx.fillRect(x + 3, y + 1, 3, 8); ctx.fillRect(x + 6, y - 1, 1, 12);
  if (save.sound) { ctx.fillRect(x + 9, y + 3, 1, 4); ctx.fillRect(x + 11, y + 1, 1, 8); }
  else { ctx.fillStyle = '#ff6060'; ctx.fillRect(x + 8, y + 1, 2, 2); ctx.fillRect(x + 10, y + 3, 2, 2); ctx.fillRect(x + 12, y + 5, 2, 2); ctx.fillRect(x + 12, y + 1, 2, 2); ctx.fillRect(x + 8, y + 5, 2, 2); }
  // nota musical
  x = BTN_MUSIC.x + 8; y = BTN_MUSIC.y + 6;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 4, y, 2, 10); ctx.fillRect(x + 4, y, 6, 2); ctx.fillRect(x + 8, y, 2, 6); ctx.fillRect(x + 1, y + 9, 5, 3); ctx.fillRect(x + 6, y + 6, 4, 3);
  if (!save.music) { ctx.fillStyle = '#ff6060'; for (let i = 0; i < 6; i++) ctx.fillRect(x + i * 2, y + 12 - i * 2, 2, 2); }
}

function drawPauseButton() {
  drawButton(BTN_PAUSE, '', '#f5a623', '#fbd36b', '#c47e12');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(BTN_PAUSE.x + 8, BTN_PAUSE.y + 7, 4, 12); ctx.fillRect(BTN_PAUSE.x + 15, BTN_PAUSE.y + 7, 4, 12);
}

function draw() {
  const sc = currentScene();
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rnd(-1, 1) * shake * 0.4), Math.round(rnd(-1, 1) * shake * 0.4));
  drawScene(sc);
  ctx.restore();
}

function drawScene(sc) {
  ctx.drawImage(sceneAssets(sc).bg, 0, 0);
  drawAmbient(sc);

  if (state === STATE.SPLASH) {
    drawGround();
    pixelText('SKYHOP', W / 2, 104, 40, '#ffffff', '#543847');
    pixelText('toque para voar', W / 2, 140, 10, '#f5f0c0', '#543847');
    ctx.save(); ctx.translate(0, -20); drawBird(); ctx.restore();
    drawButton(BTN_START, 'START');
    drawButton(BTN_SHOP, 'LOJA', '#6aa8ff', '#a8ccff', '#3a70c0');
    drawButton(BTN_RANK, 'RANKING', '#b070e8', '#d8b0ff', '#7a40b0');
    drawButton(BTN_QUEST, 'DESAFIOS', '#4cc07a', '#9ae8b4', '#2a8a4e');
    { const n = dailyDone(); pixelText(n === 3 ? 'Desafios de hoje completos!' : `Desafios de hoje: ${n}/3`, W / 2, 404, 9, n === 3 ? '#7be26a' : '#ffffff', '#543847'); }
    drawCoinHud(10, 10, save.coins);
    drawSoundButtons();
    if (save.best > 0) {
      pixelText('RECORDE', W / 2, 50, 12, '#ffffff', '#543847');
      drawNumber(save.best, W / 2, 66, smallDigits, SMALL_DW);
    }
    return;
  }

  if (state === STATE.SHOP) { drawGround(); drawShop(); return; }
  if (state === STATE.RANK) { drawGround(); drawRank(); return; }
  if (state === STATE.QUESTS) { drawGround(); drawQuests(); return; }

  drawPipes();
  drawCoins();
  drawGround();
  drawBird();

  if (state === STATE.READY) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
    pixelText('Prepare-se!', W / 2, 130, 30, '#7be26a', '#543847');
    drawTapHint(W / 2, 250);
    pixelText('TOQUE', W / 2 + 40, 236, 12, '#ffffff', '#543847');
  }

  // faíscas das moedas
  for (const q of sparks) { ctx.fillStyle = q.color || (q.t % 6 < 3 ? '#ffe97a' : '#ffcc1e'); ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); }

  if (state === STATE.PLAY || state === STATE.PAUSED || state === STATE.RESUME) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
    drawPauseButton();
    // power-ups ativos: ícone + barra de tempo
    let hy = 34;
    if (shieldOn) { drawPowerIcon(18, hy + 6, 'shield', 7); pixelText('ESCUDO', 30, hy, 9, '#c8e8ff', '#543847', 'left'); hy += 18; }
    for (const [type, t] of [['magnet', magnetT], ['slow', slowT]]) {
      if (t <= 0) continue;
      drawPowerIcon(18, hy + 6, type, 7);
      ctx.fillStyle = '#543847'; ctx.fillRect(30, hy + 3, 52, 7);
      ctx.fillStyle = POWER[type].color; ctx.fillRect(31, hy + 4, Math.round(50 * t / POWER[type].dur), 5);
      hy += 18;
    }
  }
  if (state === STATE.PAUSED) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    pixelText('PAUSADO', W / 2, 150, 30, '#ffffff', '#543847');
    panel(W / 2 - 80, 200, 160, 150);
    pixelText('PLACAR', W / 2, 214, 12, '#f5a623', '#543847');
    drawNumber(score, W / 2, 230, bigDigits, BIG_DW);
    drawButton(BTN_RESUME, 'CONTINUAR', '#4cc07a', '#9ae8b4', '#2a8a4e', 13);
    drawButton(BTN_MENU, 'MENU', '#e05a4a', '#ffa090', '#a03020', 13);
  }
  if (state === STATE.RESUME) {
    const n = Math.ceil(resumeTimer / 30);
    const k = 1 + ((resumeTimer % 30) / 30) * 0.6;
    ctx.save(); ctx.translate(W / 2, 200); ctx.scale(k, k);
    pixelText(String(n), 0, -20, 40, '#ffffff', '#543847');
    ctx.restore();
  }

  if (state === STATE.DEAD) {
    if (deadTimer > 30) {
      pixelText('Fim de jogo', W / 2, panelY - 60, 30, '#f5a623', '#543847');
      const px = W / 2 - 113, py = panelY;
      panel(px, py, 226, questTotal > 0 ? 158 : 140);
      pixelText('MEDALHA', px + 60, py + 12, 12, '#f5a623', '#543847');
      pixelText('PLACAR', px + 176, py + 12, 12, '#f5a623', '#543847');
      drawNumber(score, px + 206, py + 30, bigDigits, BIG_DW, 'right');
      pixelText('RECORDE', px + 176, py + 62, 12, '#f5a623', '#543847');
      drawNumber(save.best, px + 206, py + 80, bigDigits, BIG_DW, 'right');
      if (newBest && score > 0) {
        ctx.fillStyle = '#e04020'; ctx.fillRect(px + 128, py + 66, 30, 12);
        pixelText('NOVO', px + 143, py + 66, 9, '#ffffff', '#e04020');
      }
      const kind = score >= 40 ? 'platinum' : score >= 30 ? 'gold' : score >= 20 ? 'silver' : score >= 10 ? 'bronze' : null;
      if (kind) medal(px + 60, py + 68, kind);
      else { ctx.fillStyle = '#c9b87a'; ctx.beginPath(); ctx.arc(px + 60, py + 68, 23, 0, Math.PI * 2); ctx.fill(); }
      // moedas da partida
      pixelText('MOEDAS', px + 60, py + 104, 12, '#f5a623', '#543847');
      drawCoin(px + 120, py + 114, true);
      pixelText('+' + runCoins, px + 132, py + 106, 14, '#ffffff', '#543847', 'left');
      pixelText('total ' + save.coins, px + 206, py + 110, 9, '#543847', '#f5f0c0', 'right');
      if (questTotal > 0) {
        pixelText('DESAFIOS', px + 60, py + 126, 12, '#4cc07a', '#543847');
        drawCoin(px + 120, py + 136, true);
        pixelText('+' + questTotal, px + 132, py + 128, 14, '#ffe060', '#543847', 'left');
        pixelText(questsWon.length + (questsWon.length === 1 ? ' meta' : ' metas'), px + 206, py + 132, 9, '#543847', '#f5f0c0', 'right');
      }
      if (newStar && deadTimer % 40 < 28) pixelText('NOVA ESTRELA!', W / 2, panelY - 26, 14, '#ffd52e', '#543847');
      if (deadTimer > 60) drawButton({ x: W / 2 - 52, y: panelY + (questTotal > 0 ? 176 : 158), w: 104, h: 34 }, 'OK');
    }
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

// ---------------------------------------------------------------------------
// Loop a 60 FPS fixos (passo de tempo fixo, independente do refresh da tela)
// ---------------------------------------------------------------------------
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  let scale = Math.min(sw / W, sh / H);
  if (scale >= 1) scale = Math.floor(scale * 2) / 2;
  canvas.style.width = `${Math.floor(W * scale)}px`;
  canvas.style.height = `${Math.floor(H * scale)}px`;
}
window.addEventListener('resize', resize);
resize();

goSplash();
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
