<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Constantes do jogo (resolução nativa 288x512, igual à do original)
// ---------------------------------------------------------------------------
const W = 288, H = 512;
const GROUND_H = 112;          // altura do chão
const GROUND_Y = H - GROUND_H; // topo do chão
const GRAVITY = 0.25;          // px/frame²
const FLAP = -4.6;             // impulso do toque
const MAX_FALL = 9;            // velocidade máxima de queda
const PIPE_W = 52;
const PIPE_GAP = 88;           // espaço vertical entre os canos
const PIPE_SPACING = 172;      // distância horizontal entre pares de canos
const PIPE_SPEED = 2;          // px/frame base (canos e chão)
const SPEED_RAMP_START = 50;   // a partir deste placar a velocidade começa a subir
const SPEED_RAMP_END = 100;    // neste placar a velocidade para de subir
const PIPE_SPEED_MAX = 3.2;    // velocidade final
const BIRD_X = 62;
const BIRD_W = 34, BIRD_H = 24;
const FIRST_PIPE_X = W + 60;
const COINS_PER_BLOCK = 10;    // moedas distribuídas...
const PIPES_PER_BLOCK = 30;    // ...a cada 30 canos
const COIN_R = 7;

const STATE = { SPLASH: 0, READY: 1, PLAY: 2, DEAD: 3, SHOP: 4, RANK: 5 };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------------------------------------------------------------------------
// Utilitários de sprite (arte própria, gerada por código)
// ---------------------------------------------------------------------------
function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  draw(g);
  return c;
}

// desenha a partir de um "mapa de pixels" em texto
function fromMap(rows, palette, scale = 1, deco) {
  const h = rows.length, w = rows[0].length;
  return makeSprite(w * scale, h * scale, g => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || !palette[ch]) continue;
      g.fillStyle = palette[ch];
      g.fillRect(x * scale, y * scale, scale, scale);
    }
    if (deco) deco(g, scale);
  });
}

// ---------------------------------------------------------------------------
// Pássaros: um mapa base 17x12 em 3 quadros (asa em cima / meio / embaixo)
// Letras: k contorno, b corpo, s sombra do corpo, w olho, r bico, e barriga,
// c destaque de cor secundária (usado em alguns designs)
// ---------------------------------------------------------------------------
const BIRD_MAPS = [

  '....kkbbbbbbkk...',
  '...kbbbbbkwwwwk..',
  '..kbbbbbbkwwwwwk.',
  '.ksssbbbbkwwwkwk.',
  'ksbbbsbbbkwwwwwk.',
  'ksbbbbsbbbkkkkk..',
  'ksbbbbsbbbkrrrrrk',
  '.kssssbbbbrkkkkkk',
  '..kkkkeeeekrrrrk.',
  '....kkeeeeekkkk..',
  '......kkkkkk.....',
  ],
  [
  '......kkkkkk.....',

  '...kbbbbbkwwwwk..',
  '..kbbbbbbkwwwwwk.',
  '.kbbbbbbbkwwwkwk.',
  'kssssssbbkwwwwwk.',
  'ksbbbbsbbbkkkkk..',
  'ksbbbbsbbbkrrrrrk',
  '.kssssbbbbrkkkkkk',
  '..kkkkeeeekrrrrk.',
  '....kkeeeeekkkk..',
  '......kkkkkk.....',
  ],
  [

  '....kkbbbbbbkk...',
  '...kbbbbbkwwwwk..',
  '..kbbbbbbkwwwwwk.',
  '.kbbbbbbbkwwwkwk.',
  'kbbbbbbbbkwwwwwk.',
  'kbbbbbbbbbkkkkk..',
  'kssssssbbbkrrrrrk',
  '.ksbbbsbbbrkkkkkk',
  '..kssseeeekrrrrk.',
  '....kkeeeeekkkk..',
  '......kkkkkk.....',
  ],

// Decorações extras por design (desenhadas por cima do mapa, em escala 2)
const DECO = {
  none: null,
  // topete de três penas
  crest: (g, s, c) => {
    g.fillStyle = '#000';
    g.fillRect(7*s, -0*s, 1*s, 1*s);
    g.fillStyle = c;
    g.fillRect(6*s, 0*s, 2*s, 1*s); g.fillRect(8*s, 0*s, 1*s, 1*s); g.fillRect(5*s, 1*s, 1*s, 1*s);

  },
  // cauda longa de penas
  tail: (g, s, c) => {
    g.fillStyle = c;
    g.fillRect(0, 5*s, 1*s, 1*s); g.fillRect(0, 7*s, 1*s, 1*s);
    g.fillStyle = '#000';
    g.fillRect(0, 4*s, 1*s, 1*s); g.fillRect(0, 6*s, 1*s, 1*s); g.fillRect(0, 8*s, 1*s, 1*s);

    g.fillRect(10*s, 3*s, 2*s, 1*s);
  },
  // estrelinhas brancas (pássaro noturno)
  stars: (g, s) => {
    g.fillStyle = '#fff';

  },
  // coroa dourada
  crown: (g, s) => {
    g.fillStyle = '#000';
    g.fillRect(7*s, 0, 6*s, 1*s);
    g.fillStyle = '#ffd52e';
    g.fillRect(8*s, 0, 4*s, 1*s); g.fillRect(8*s, -1*s, 1*s, 1*s); g.fillRect(10*s, -1*s, 1*s, 1*s); g.fillRect(12*s, -1*s, 1*s, 1*s);

  return Object.assign({ k: '#000000', b: body, s: shade, e: belly, w: '#ffffff', r: beak }, extra);

  { id: 'neve',     name: 'Neve',      rarity: 'raro',     price: 90,  pal: pal('#f4f8ff', '#b8c8dc', '#ffffff', '#f8a020', { w: '#dfe8f5' }) },
  { id: 'fogo',     name: 'Fogo',      rarity: 'epico',    price: 160, pal: pal('#ff5a1f', '#b02000', '#ffd040', '#ffe060'), deco: 'crest', decoColor: '#ffd040' },
  { id: 'gelo',     name: 'Gelo',      rarity: 'epico',    price: 160, pal: pal('#9ae8ff', '#40a8d8', '#ffffff', '#3060c0'), deco: 'shades' },

// Desbloqueio para demonstração (fica vazio na versão normal)
const DEMO_UNLOCK = [];

function buildBirdFrames(def, palette) {
  const deco = def.deco ? (g, s) => DECO[def.deco](g, s, def.decoColor) : null;
  return BIRD_MAPS.map(m => fromMap(m, palette || def.pal, 2, deco));
}
for (const def of BIRDS) {
  if (def.rainbow) {
    // 12 paletas girando o matiz; o desenho troca de cor com o tempo
    def.rainbowFrames = [];
    for (let i = 0; i < 12; i++) {
      const h = i * 30;
      def.rainbowFrames.push(buildBirdFrames(def, pal(`hsl(${h},95%,58%)`, `hsl(${h},85%,38%)`, `hsl(${h},90%,88%)`, `hsl(${(h+180)%360},90%,55%)`)));
    }
    def.frames = def.rainbowFrames[0];
  } else {
    def.frames = buildBirdFrames(def);
  }
}
function birdSprite(def, frame) {
  if (def.rainbow) return def.rainbowFrames[Math.floor(frames / 5) % 12][frame];
  return def.frames[frame];
}
window.__birdSprite = BIRDS[0].frames[1]; // usado por ferramentas externas (geração de ícone)

// ---------------------------------------------------------------------------
// Moeda (3 quadros de giro)

const COIN_FRAMES = [16, 10, 4, 10].map(w => makeSprite(16, 16, g => {

// ---------------------------------------------------------------------------
// Cenários: cada um define cores do céu/chão/canos, um pintor de fundo e
// um efeito de ambiente opcional. Os sprites são montados na primeira vez
// que o cenário é usado e ficam em cache.
// ---------------------------------------------------------------------------
const PIPE_CAP_W = PIPE_W + 4, PIPE_CAP_H = 26;
const GROUND_TILE_W = 24;

function buildPipes(c) { // c = [contorno, corpo, claro, brilho, escuro, mais escuro]
  const body = makeSprite(PIPE_W, 8, g => {
    g.fillStyle = c[0]; g.fillRect(0, 0, PIPE_W, 8);
    g.fillStyle = c[1]; g.fillRect(1, 0, PIPE_W - 2, 8);
    g.fillStyle = c[2]; g.fillRect(4, 0, 8, 8);
    g.fillStyle = c[3]; g.fillRect(6, 0, 3, 8);
    g.fillStyle = c[4]; g.fillRect(PIPE_W - 12, 0, 8, 8);
    g.fillStyle = c[5]; g.fillRect(PIPE_W - 4, 0, 3, 8);
  });
  const cap = makeSprite(PIPE_CAP_W, PIPE_CAP_H, g => {
    g.fillStyle = c[0]; g.fillRect(0, 0, PIPE_CAP_W, PIPE_CAP_H);
    g.fillStyle = c[1]; g.fillRect(1, 1, PIPE_CAP_W - 2, PIPE_CAP_H - 2);
    g.fillStyle = c[2]; g.fillRect(5, 1, 10, PIPE_CAP_H - 2);
    g.fillStyle = c[3]; g.fillRect(7, 1, 4, PIPE_CAP_H - 2);
    g.fillStyle = c[4]; g.fillRect(PIPE_CAP_W - 14, 1, 10, PIPE_CAP_H - 2);
    g.fillStyle = c[5]; g.fillRect(PIPE_CAP_W - 5, 1, 3, PIPE_CAP_H - 2);
    g.fillStyle = c[0]; g.fillRect(0, PIPE_CAP_H - 1, PIPE_CAP_W, 1);
  });
  return { body, cap };
}

function buildGround(c) { // c = [terra, linha, grama, grama clara, grama escura, faixa, risco]
  const GW = W + GROUND_TILE_W;
  return makeSprite(GW, GROUND_H, g => {
    g.fillStyle = c[0]; g.fillRect(0, 0, GW, GROUND_H);
    g.fillStyle = c[1]; g.fillRect(0, 0, GW, 2);
    g.fillStyle = c[2]; g.fillRect(0, 2, GW, 10);
    g.fillStyle = c[3];
    for (let x = 0; x < GW; x += GROUND_TILE_W) { g.fillRect(x, 2, 12, 4); g.fillRect(x + 6, 6, 12, 3); g.fillRect(x + 12, 9, 12, 3); }
    g.fillStyle = c[4]; g.fillRect(0, 12, GW, 2);
    g.fillStyle = c[5]; g.fillRect(0, 14, GW, 4);
    g.fillStyle = c[6];
    for (let x = 0; x < GW; x += GROUND_TILE_W) g.fillRect(x + 4, 24, 8, 2);
  });
}

  stars(g, n, seed, color = '#ffffff') { let r = seed; const rand = () => (r = (r * 16807) % 2147483647) / 2147483647; g.fillStyle = color; for (let i = 0; i < n; i++) { const x = Math.floor(rand() * W), y = Math.floor(rand() * 280); g.fillRect(x, y, rand() < 0.2 ? 2 : 1, rand() < 0.2 ? 2 : 1); } },
  clouds(g, y, color) { g.fillStyle = color; for (let x = -10; x < W + 40; x += 48) { g.beginPath(); g.arc(x + 12, y, 18, 0, Math.PI * 2); g.arc(x + 34, y + 6, 14, 0, Math.PI * 2); g.fill(); } g.fillRect(0, y + 6, W, 30); },
  buildings(g, base, color, win, list) { for (const [x, w, h] of list) g.fillRect(x, base - h, w, h); if (win) { g.fillStyle = win; for (const [x, w, h] of list) for (let y = base - h + 6; y < base - 4; y += 8) for (let xx = x + 4; xx < x + w - 4; xx += 8) g.fillRect(xx, y, 3, 3); } },

  fill(g, y, color) { g.fillStyle = color; g.fillRect(0, y, W, GROUND_Y - y); },

};

  if (fx === 'stars' && ambient.length < 14) ambient.push({ x: rnd(0, W), y: rnd(0, 250), vx: 0, vy: 0, s: 2, t: rnd(20, 60) });

  }

    p.x += p.vx - (fx === 'snow' || fx === 'rain' ? wind * 0.3 : 0); p.y += p.vy; p.t--;

let audioCtx = null;
function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freqFrom, freqTo, dur, type = 'square', vol = 0.12, delay = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + delay;
  o.type = type;
  o.frequency.setValueAtTime(freqFrom, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, freqTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, delay = 0) {
  const a = audio(); if (!a) return;
  const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
}

// ---------------------------------------------------------------------------
// Fogo: sistema de partículas com física
// Cada chama nasce nas costas/cabeça do pássaro e:
//  - herda o movimento do pássaro (inércia) e é arrastada pelo vento
//    contrário ao deslocamento (o mundo corre para a esquerda);
//  - sobe por empuxo (ar quente), com aceleração constante para cima;
//  - perde velocidade horizontal pelo arrasto e treme aleatoriamente;
//  - esfria com o tempo: branco -> amarelo -> laranja -> vermelho -> fumaça,
//    encolhendo até apagar.
// ---------------------------------------------------------------------------
const FIRE_BUOYANCY = -0.045;   // aceleração para cima
const FIRE_DRAG = 0.955;        // atrito horizontal por frame
const FIRE_LIFE = [20, 34];     // duração em frames
const FIRE_MAX = 260;
const FIRE_RISE_MAX = -1.6;     // velocidade máxima de subida (ar quente)

function rnd(a, b) { return a + Math.random() * (b - a); }

// emite chamas a partir de um pássaro (posição, rotação, velocidade vertical)
// wind = velocidade do mundo para a esquerda (0 quando parado)
function emitFire(list, b, wind, rate = 1) {
  const cx = b.x + BIRD_W / 2, cy = b.y + BIRD_H / 2;
  const cos = Math.cos(b.rot), sin = Math.sin(b.rot);
  const spawn = (lx, ly, n, hot) => {
    for (let i = 0; i < n; i++) {
      if (list.length >= FIRE_MAX) return;
      // ponto local (relativo ao centro) girado junto com o pássaro
      const ox = lx + rnd(-2, 2), oy = ly + rnd(-3, 3);
      const x = cx + ox * cos - oy * sin, y = cy + ox * sin + oy * cos;
      list.push({
        x, y,
        vx: -wind * rnd(0.7, 1.0) + rnd(-0.5, 0.5),
        vy: -b.vy * rnd(0.35, 0.6) + rnd(-0.6, 0.1),   // inércia + sopro inicial
        life: rnd(FIRE_LIFE[0], FIRE_LIFE[1]) * (hot ? 1 : 0.7),
        max: 0, size: hot ? rnd(3, 6) : rnd(2, 4),
      });
      list[list.length - 1].max = list[list.length - 1].life;
    }
  };
  spawn(-BIRD_W / 2 + 3, 0, Math.round(4 * rate), true);   // costas
  spawn(-BIRD_W / 2 + 6, -5, Math.round(1 * rate), true);
  spawn(2, -BIRD_H / 2 + 1, Math.random() < 0.7 * rate ? 1 : 0, false); // topo da cabeça
}

function updateFire(list) {
  for (const p of list) {
    p.vy = Math.max(FIRE_RISE_MAX, p.vy + FIRE_BUOYANCY);
    p.vx *= FIRE_DRAG;
    p.vx += rnd(-0.18, 0.18);          // turbulência
    p.vy += rnd(-0.08, 0.08);
    p.x += p.vx; p.y += p.vy;
    p.life--;
  }
  for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1);
}

function drawFire(list) {
  for (const p of list) {
    const t = p.life / p.max;                 // 1 = recém-nascida, 0 = apagando
    let color, size = Math.max(1, Math.round(p.size * (0.4 + t * 0.8)));
    if (t > 0.8)      color = '#fff6c0';
    else if (t > 0.6) color = '#ffd23a';
    else if (t > 0.4) color = '#ff7a1c';
    else if (t > 0.2) color = '#d42a10';
    else { color = 'rgba(70,60,60,' + (t * 2.5).toFixed(2) + ')'; size += 1; } // fumaça
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(p.x - size / 2), Math.round(p.y - size / 2), size, size);
  }
}

let fire = [];        // chamas do pássaro em jogo
let shopFire = [];    // chamas da prévia na loja

// ---------------------------------------------------------------------------
// Dados salvos (recorde, moedas, pássaros comprados, pássaro escolhido)
// ---------------------------------------------------------------------------
const save = { best: 0, coins: 0, owned: ['amarelo'], selected: 'amarelo', ownedScenes: ['dia'], scene: 'dia', birdBest: {}, sceneBest: {} };
try {
  const raw = JSON.parse(localStorage.getItem('flappy-save') || 'null');
  if (raw) Object.assign(save, raw);
  const legacyBest = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0;
  if (legacyBest > save.best) save.best = legacyBest;
} catch (e) {}
if (!save.owned.includes('amarelo')) save.owned.push('amarelo');
for (const id of DEMO_UNLOCK) if (!save.owned.includes(id)) save.owned.push(id);
if (!save.ownedScenes.includes('dia')) save.ownedScenes.push('dia');
for (const id of DEMO_UNLOCK_SCENES) if (!save.ownedScenes.includes(id)) save.ownedScenes.push(id);
if (!SCENES.some(s => s.id === save.scene)) save.scene = 'dia';
if (!save.birdBest) save.birdBest = {};
if (!save.sceneBest) save.sceneBest = {};
if (!BIRDS.some(b => b.id === save.selected)) save.selected = 'amarelo';
function persist() { try { localStorage.setItem('flappy-save', JSON.stringify(save)); } catch (e) {} }
function currentBird() { return BIRDS.find(b => b.id === save.selected) || BIRDS[0]; }
function currentScene() { return SCENES.find(s => s.id === save.scene) || SCENES[0]; }

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------
let state = STATE.SPLASH;
let frames = 0;
let bird, pipes, score, groundX, deadTimer, panelY, flashAlpha, newBest, newStar = false;
let rankTab = 'birds';
let runCoins = 0;               // moedas pegas nesta partida
let pipeIndex = 0;              // quantos canos já foram criados nesta partida
let coinSlots = [];             // quais índices do bloco atual têm moeda
let shopMsg = null;             // aviso na loja ("moedas insuficientes")
let shopTab = 'birds';          // 'birds' ou 'scenes'
let popups = [];                // "+1" flutuando ao pegar moeda

function resetBird() {
  bird = { x: BIRD_X, y: 220, vy: 0, rot: 0, frame: 0, animT: 0 };
}

function resetRun() { resetBird(); pipes = []; score = 0; groundX = 0; runCoins = 0; pipeIndex = 0; popups = []; fire = []; }
function goSplash() { state = STATE.SPLASH; resetRun(); }
function goReady()  { state = STATE.READY; resetRun(); SFX.swoosh(); }
function goShop()   { state = STATE.SHOP; shopMsg = null; SFX.swoosh(); }
function goRank()   { state = STATE.RANK; SFX.swoosh(); }

function goPlay() {
  state = STATE.PLAY;
  pipes = [];
  spawnPipe(FIRST_PIPE_X);
  flap();
}

// velocidade atual: fixa até 50 pontos, sobe linearmente até 100 e depois trava
function speed() {
  if (score <= SPEED_RAMP_START) return PIPE_SPEED;
  const t = Math.min(1, (score - SPEED_RAMP_START) / (SPEED_RAMP_END - SPEED_RAMP_START));
  return PIPE_SPEED + (PIPE_SPEED_MAX - PIPE_SPEED) * t;
}

// Sorteia, para cada bloco de 30 canos, 10 posições que terão moeda.
// Assim a média é sempre 10 a cada 30, mas nunca se sabe em qual cano vem.
function rollCoinSlots() {
  const idx = Array.from({ length: PIPES_PER_BLOCK }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  coinSlots = new Set(idx.slice(0, COINS_PER_BLOCK));
}

function spawnPipe(x) {
  const minTop = 60, maxTop = GROUND_Y - PIPE_GAP - 60;
  const top = Math.floor(minTop + Math.random() * (maxTop - minTop));
  if (pipeIndex % PIPES_PER_BLOCK === 0) rollCoinSlots();
  const hasCoin = coinSlots.has(pipeIndex % PIPES_PER_BLOCK);
  pipeIndex++;
  pipes.push({ x, top, passed: false, coin: hasCoin, coinTaken: false });
}

function flap() {
  bird.vy = FLAP;
  SFX.wing();
}

function die() {
  state = STATE.DEAD;
  deadTimer = 0;
  panelY = H;
  flashAlpha = 1;
  newBest = score > save.best;
  if (newBest) save.best = score;
  const bid = currentBird().id, sid = currentScene().id;
  const oldStars = starsFor(save.birdBest[bid] || 0) + starsFor(save.sceneBest[sid] || 0);
  if (score > (save.birdBest[bid] || 0)) save.birdBest[bid] = score;
  if (score > (save.sceneBest[sid] || 0)) save.sceneBest[sid] = score;
  newStar = starsFor(save.birdBest[bid]) + starsFor(save.sceneBest[sid]) > oldStars;
  persist();
  SFX.hit();
  if (bird.y < GROUND_Y - BIRD_H) SFX.die();
}

// ---------------------------------------------------------------------------
// Layout de botões e loja (usado tanto para desenhar quanto para o toque)
// ---------------------------------------------------------------------------
const BTN_START = { x: W / 2 - 52, y: 298, w: 104, h: 30 };
const BTN_SHOP  = { x: W / 2 - 52, y: 334, w: 104, h: 30 };
const BTN_RANK  = { x: W / 2 - 52, y: 370, w: 104, h: 30 };
const RANK_ROW_H = 26, RANK_Y0 = 70;
const BTN_BACK  = { x: 8, y: 8, w: 64, h: 26 };
const TAB_BIRDS  = { x: W / 2 - 92, y: 40, w: 90, h: 22 };
const TAB_SCENES = { x: W / 2 + 2,  y: 40, w: 90, h: 22 };
const SCENE_COLS = 2, SCENE_CELL_W = 130, SCENE_CELL_H = 74, SCENE_X0 = (W - SCENE_COLS * SCENE_CELL_W) / 2, SCENE_Y0 = 68;
function sceneCell(i) {
  return { x: SCENE_X0 + (i % SCENE_COLS) * SCENE_CELL_W + 3, y: SCENE_Y0 + Math.floor(i / SCENE_COLS) * SCENE_CELL_H + 3, w: SCENE_CELL_W - 6, h: SCENE_CELL_H - 6 };
}
const SHOP_COLS = 3, SHOP_CELL_W = 88, SHOP_CELL_H = 80, SHOP_X0 = (W - SHOP_COLS * SHOP_CELL_W) / 2, SHOP_Y0 = 68;
function shopCell(i) {
  return { x: SHOP_X0 + (i % SHOP_COLS) * SHOP_CELL_W + 3, y: SHOP_Y0 + Math.floor(i / SHOP_COLS) * SHOP_CELL_H + 3, w: SHOP_CELL_W - 6, h: SHOP_CELL_H - 6 };
}
function inside(pt, r) { return pt && pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h; }

// ---------------------------------------------------------------------------
// Entrada
// ---------------------------------------------------------------------------
function input(pt) {
  audio();
  switch (state) {
    case STATE.SPLASH:
      if (inside(pt, BTN_SHOP)) goShop(); else if (inside(pt, BTN_RANK)) goRank(); else goReady();
      break;
    case STATE.RANK:
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      if (inside(pt, TAB_BIRDS))  { rankTab = 'birds';  SFX.swoosh(); }
      if (inside(pt, TAB_SCENES)) { rankTab = 'scenes'; SFX.swoosh(); }
      break;
    case STATE.READY:  goPlay(); break;
    case STATE.PLAY:   flap(); break;
    case STATE.DEAD:
      if (deadTimer > 60) goSplash();
      break;
    case STATE.SHOP:
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      if (inside(pt, TAB_BIRDS))  { shopTab = 'birds';  SFX.swoosh(); break; }
      if (inside(pt, TAB_SCENES)) { shopTab = 'scenes'; SFX.swoosh(); break; }
      if (shopTab === 'birds') {
        for (let i = 0; i < BIRDS.length; i++) if (inside(pt, shopCell(i))) { shopTap(BIRDS[i]); break; }
      } else {
        for (let i = 0; i < SCENES.length; i++) if (inside(pt, sceneCell(i))) { sceneTap(SCENES[i]); break; }
      }
      break;
  }
}
function shopTap(def) {
  if (save.owned.includes(def.id)) {
    save.selected = def.id; persist(); SFX.swoosh(); shopMsg = null;
  } else if (save.coins >= def.price) {
    save.coins -= def.price; save.owned.push(def.id); save.selected = def.id; persist(); SFX.buy();
    shopMsg = { text: `${def.name} comprado!`, color: '#7be26a', t: 90 };
  } else {
    SFX.deny();
    shopMsg = { text: `Faltam ${def.price - save.coins} moedas`, color: '#ff6060', t: 90 };
  }
}
function sceneTap(sc) {
  if (save.ownedScenes.includes(sc.id)) {
    save.scene = sc.id; persist(); SFX.swoosh(); shopMsg = null; ambient = [];
  } else if (save.coins >= sc.price) {
    save.coins -= sc.price; save.ownedScenes.push(sc.id); save.scene = sc.id; persist(); SFX.buy(); ambient = [];
    shopMsg = { text: `Cenario ${sc.name} comprado!`, color: '#7be26a', t: 90 };
  } else {
    SFX.deny();
    shopMsg = { text: `Faltam ${sc.price - save.coins} moedas`, color: '#ff6060', t: 90 };
  }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); input(null); }
  if (e.code === 'Escape' && (state === STATE.SHOP || state === STATE.RANK)) goSplash();
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  input({ x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height });
});
window.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------------
// Atualização
// ---------------------------------------------------------------------------
function birdBox() { return { x: bird.x + 4, y: bird.y + 4, w: BIRD_W - 8, h: BIRD_H - 8 }; }

function collides() {
  const b = birdBox();
  if (b.y + b.h >= GROUND_Y) return true;
  for (const p of pipes) {
    if (b.x + b.w > p.x && b.x < p.x + PIPE_W) {
      if (b.y < p.top || b.y + b.h > p.top + PIPE_GAP) return true;
    }
  }
  return false;
}

function coinPos(p) { return { x: p.x + PIPE_W / 2, y: p.top + PIPE_GAP / 2 }; }

function collectCoins() {
  const b = birdBox();
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    const nx = Math.max(b.x, Math.min(c.x, b.x + b.w)), ny = Math.max(b.y, Math.min(c.y, b.y + b.h));
    if ((nx - c.x) ** 2 + (ny - c.y) ** 2 <= COIN_R * COIN_R) {
      p.coinTaken = true; runCoins++; save.coins++;
      popups.push({ x: c.x, y: c.y, t: 40 });
      SFX.coin();
    }
  }
}

function updateBirdPhysics() {
  bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
  bird.y += bird.vy;
  if (bird.y < -BIRD_H) { bird.y = -BIRD_H; bird.vy = 0; }
  if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
  const target = bird.vy < 0 ? -0.45 : Math.min(Math.PI / 2, (bird.vy - 1) * 0.22);
  bird.rot = bird.vy < 0 ? target : Math.min(target, bird.rot + 0.06);
  if (bird.vy < 0) bird.rot = -0.45;
}

function animateBird(speed) {
  bird.animT++;
  if (bird.animT >= speed) { bird.animT = 0; bird.frame = (bird.frame + 1) % 4; }
}

function update() {
  frames++;
  for (const q of popups) { q.t--; q.y -= 0.6; }
  popups = popups.filter(q => q.t > 0);
  if (shopMsg && --shopMsg.t <= 0) shopMsg = null;

  // fogo do pássaro em uso (em todas as telas onde ele aparece)
  if (currentBird().fire && state !== STATE.SHOP && state !== STATE.RANK) {
    const wind = state === STATE.PLAY ? speed() : state === STATE.DEAD ? 0 : PIPE_SPEED;
    const onGround = state === STATE.DEAD && bird.y >= GROUND_Y - BIRD_H;
    emitFire(fire, bird, wind, onGround ? 0.6 : 1);
  }
  updateFire(fire);
  updateAmbient(currentScene(), state === STATE.PLAY ? speed() : state === STATE.DEAD ? 0 : PIPE_SPEED);
  // prévia da loja
  if (state === STATE.SHOP) {
    const i = BIRDS.findIndex(b => b.fire);
    if (i >= 0) {
      const r = shopCell(i);
      const pb = { x: r.x + r.w / 2 - BIRD_W / 2, y: r.y + 17, rot: 0, vy: 0 };
      emitFire(shopFire, pb, 0.6, 0.5);
    }
    updateFire(shopFire);
  } else shopFire = [];

  switch (state) {
    case STATE.SPLASH:
    case STATE.READY:
    case STATE.SHOP:
    case STATE.RANK:
      groundX = (groundX - PIPE_SPEED) % GROUND_TILE_W;
      bird.y = 220 + Math.sin(frames / 8) * 5;
      bird.rot = 0;
      animateBird(6);
      break;

    case STATE.PLAY: {
      const v = speed();
      groundX = (groundX - v) % GROUND_TILE_W;
      animateBird(4);
      updateBirdPhysics();
      for (const p of pipes) {
        p.x -= v;
        if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; SFX.point(); }
      }
      if (pipes.length && pipes[0].x < -PIPE_CAP_W) pipes.shift();
      if (pipes[pipes.length - 1].x <= W - PIPE_SPACING + PIPE_W) spawnPipe(pipes[pipes.length - 1].x + PIPE_SPACING);
      collectCoins();
      if (collides()) die();
      break;
    }

    case STATE.DEAD:
      deadTimer++;
      flashAlpha = Math.max(0, flashAlpha - 0.08);
      if (bird.y < GROUND_Y - BIRD_H) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL);
        bird.y += bird.vy;
        if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
        bird.rot = Math.min(Math.PI / 2, bird.rot + 0.12);
      }
      if (deadTimer > 30) panelY = Math.max(H / 2 - 130, panelY - 14);
      break;
  }
}

// ---------------------------------------------------------------------------
// Desenho
// ---------------------------------------------------------------------------
function drawPipes() {
  const { body, cap } = sceneAssets(currentScene()).pipes;
  for (const p of pipes) {
    const x = Math.round(p.x);
    for (let y = p.top - PIPE_CAP_H - 8; y > -8; y -= 8) ctx.drawImage(body, x, y);
    ctx.drawImage(cap, x - 2, p.top - PIPE_CAP_H);
    const bottom = p.top + PIPE_GAP;
    ctx.drawImage(cap, x - 2, bottom);
    for (let y = bottom + PIPE_CAP_H; y < GROUND_Y; y += 8) ctx.drawImage(body, x, y, PIPE_W, Math.min(8, GROUND_Y - y));
  }
}

function drawCoin(x, y, big = false, spin = false) {
  const f = spin ? COIN_FRAMES[Math.floor(frames / 6) % 4] : COIN_FRAMES[0];
  if (big) ctx.drawImage(f, Math.round(x - 8), Math.round(y - 8));
  else ctx.drawImage(f, 0, 0, 16, 16, Math.round(x - 6), Math.round(y - 6), 12, 12);
}

function drawCoins() {
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    drawCoin(c.x, c.y + Math.sin(frames / 10) * 2, true, true);
  }
  for (const q of popups) pixelText('+1', q.x, q.y - 14, 11, '#ffe060', '#543847');
}

function drawBird(def = currentBird(), b = bird) {
  const f = [0, 1, 2, 1][b.frame];
  if (def.fire) drawFire(b === bird ? fire : shopFire);
  ctx.save();
  ctx.translate(Math.round(b.x + BIRD_W / 2), Math.round(b.y + BIRD_H / 2));
  ctx.rotate(b.rot);
  ctx.drawImage(birdSprite(def, f), -BIRD_W / 2, -BIRD_H / 2);
  ctx.restore();
}

function drawGround() { ctx.drawImage(sceneAssets(currentScene()).ground, Math.round(groundX), GROUND_Y); }

function drawTapHint(x, y) {

  drawButton(TAB_BIRDS,  'PASSAROS', ...(shopTab === 'birds'  ? on : off), 10);
  drawButton(TAB_SCENES, 'CENARIOS', ...(shopTab === 'scenes' ? on : off), 10);

  if (shopTab === 'scenes') { drawSceneShop(); return; }
  for (let i = 0; i < BIRDS.length; i++) {
    const def = BIRDS[i], r = shopCell(i), rar = RARITY[def.rarity];
    const owned = save.owned.includes(def.id), sel = save.selected === def.id;
    // moldura na cor da raridade; selecionado ganha borda branca
    ctx.fillStyle = sel ? '#ffffff' : '#543847'; ctx.fillRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    ctx.fillStyle = rar.color; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = owned ? '#f5f0c0' : '#ded895'; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
    pixelText(rar.label, r.x + r.w / 2, r.y + 4, 8, rar.color, '#543847');
    const preview = { x: r.x + r.w / 2 - BIRD_W / 2, y: r.y + 17 + (sel ? Math.sin(frames / 8) * 2 : 0), rot: 0, frame: bird.frame };
    if (!owned) ctx.globalAlpha = 0.55;
    drawBird(def, preview);
    ctx.globalAlpha = 1;
    pixelText(def.name, r.x + r.w / 2, r.y + 41, 10, '#543847', '#f5f0c0');
    drawStars(r.x + r.w / 2 - 20, r.y + 53, starsFor(save.birdBest[def.id] || 0), 8);
    if (sel) pixelText('EM USO', r.x + r.w / 2, r.y + 61, 9, '#ffffff', '#3a9a2a');
    else if (owned) pixelText('USAR', r.x + r.w / 2, r.y + 61, 9, '#ffffff', '#543847');
    else {
      drawCoin(r.x + r.w / 2 - 16, r.y + 67, false);
      pixelText(String(def.price), r.x + r.w / 2 - 6, r.y + 61, 10, save.coins >= def.price ? '#ffe060' : '#ff9090', '#543847', 'left');
    }
  }
  if (shopMsg) {
    ctx.globalAlpha = Math.min(1, shopMsg.t / 20);
    pixelText(shopMsg.text, W / 2, H - 42, 13, shopMsg.color, '#543847');
    ctx.globalAlpha = 1;
  }
  pixelText('Pegue moedas nos canos para comprar', W / 2, H - 22, 9, '#ffffff', '#543847');
}

function draw() {
  const sc = currentScene();
  ctx.drawImage(sceneAssets(sc).bg, 0, 0);
  drawAmbient(sc);

  if (state === STATE.SPLASH) {
    drawGround();
    pixelText('Flappy Bird', W / 2, 110, 34, '#ffffff', '#543847');
    ctx.save(); ctx.translate(0, -20); drawBird(); ctx.restore();
    drawButton(BTN_START, 'START');
    drawButton(BTN_SHOP, 'LOJA', '#6aa8ff', '#a8ccff', '#3a70c0');
    drawButton(BTN_RANK, 'RANKING', '#b070e8', '#d8b0ff', '#7a40b0');
    drawCoinHud(10, 10, save.coins);
    if (save.best > 0) {
      pixelText('RECORDE', W / 2, 50, 12, '#ffffff', '#543847');
      drawNumber(save.best, W / 2, 66, smallDigits, SMALL_DW);
    }
    return;
  }

  if (state === STATE.SHOP) { drawGround(); drawShop(); return; }
  if (state === STATE.RANK) { drawGround(); drawRank(); return; }

  drawPipes();
  drawCoins();
  drawGround();
  drawBird();

  if (state === STATE.READY) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
    pixelText('Prepare-se!', W / 2, 130, 30, '#7be26a', '#543847');
    drawTapHint(W / 2, 250);
    pixelText('TOQUE', W / 2 + 40, 236, 12, '#ffffff', '#543847');
  }

  if (state === STATE.PLAY) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
  }

  if (state === STATE.DEAD) {
    if (deadTimer > 30) {
      pixelText('Fim de jogo', W / 2, panelY - 60, 30, '#f5a623', '#543847');
      const px = W / 2 - 113, py = panelY;
      panel(px, py, 226, 140);
      pixelText('MEDALHA', px + 60, py + 12, 12, '#f5a623', '#543847');
      pixelText('PLACAR', px + 176, py + 12, 12, '#f5a623', '#543847');
      drawNumber(score, px + 206, py + 30, bigDigits, BIG_DW, 'right');
      pixelText('RECORDE', px + 176, py + 62, 12, '#f5a623', '#543847');
      drawNumber(save.best, px + 206, py + 80, bigDigits, BIG_DW, 'right');
      if (newBest && score > 0) {
        ctx.fillStyle = '#e04020'; ctx.fillRect(px + 128, py + 66, 30, 12);
        pixelText('NOVO', px + 143, py + 66, 9, '#ffffff', '#e04020');
      }
      const kind = score >= 40 ? 'platinum' : score >= 30 ? 'gold' : score >= 20 ? 'silver' : score >= 10 ? 'bronze' : null;
      if (kind) medal(px + 60, py + 68, kind);
      else { ctx.fillStyle = '#c9b87a'; ctx.beginPath(); ctx.arc(px + 60, py + 68, 23, 0, Math.PI * 2); ctx.fill(); }
      // moedas da partida
      pixelText('MOEDAS', px + 60, py + 104, 12, '#f5a623', '#543847');
      drawCoin(px + 120, py + 114, true);
      pixelText('+' + runCoins, px + 132, py + 106, 14, '#ffffff', '#543847', 'left');
      pixelText('total ' + save.coins, px + 206, py + 110, 9, '#543847', '#f5f0c0', 'right');
      if (newStar && deadTimer % 40 < 28) pixelText('NOVA ESTRELA!', W / 2, panelY - 26, 14, '#ffd52e', '#543847');
      if (deadTimer > 60) drawButton({ x: W / 2 - 52, y: panelY + 158, w: 104, h: 34 }, 'OK');
    }
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

// ---------------------------------------------------------------------------
// Loop a 60 FPS fixos (passo de tempo fixo, independente do refresh da tela)
// ---------------------------------------------------------------------------
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  let scale = Math.min(sw / W, sh / H);
  if (scale >= 1) scale = Math.floor(scale * 2) / 2;
  canvas.style.width = `${Math.floor(W * scale)}px`;
  canvas.style.height = `${Math.floor(H * scale)}px`;
}
window.addEventListener('resize', resize);
resize();

goSplash();
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
