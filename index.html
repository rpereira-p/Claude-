function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  draw(g);
  return c;
}

// desenha a partir de um "mapa de pixels" em texto
function fromMap(rows, palette, scale = 1, deco) {
  const h = rows.length, w = rows[0].length;
  return makeSprite(w * scale, h * scale, g => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || !palette[ch]) continue;
      g.fillStyle = palette[ch];
      g.fillRect(x * scale, y * scale, scale, scale);
    }
    if (deco) deco(g, scale);
  });
}

function drawNumber(n, cx, y, digits, dw, align = 'center') {
  const s = String(n);
  const totalW = s.length * (dw + 2) - 2;
  let x = align === 'center' ? cx - totalW / 2 : align === 'right' ? cx - totalW : cx;
  for (const ch of s) { ctx.drawImage(digits[ch], Math.round(x), y); x += dw + 2; }
}

function pixelText(text, x, y, size, fill, stroke, align = 'center') {
  ctx.save();
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.lineWidth = size >= 12 ? 4 : 3; ctx.lineJoin = 'round';
  ctx.strokeStyle = stroke; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
  ctx.restore();
}

}

let audioCtx = null;
function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freqFrom, freqTo, dur, type = 'square', vol = 0.12, delay = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + delay;
  o.type = type;
  o.frequency.setValueAtTime(freqFrom, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, freqTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, delay = 0) {
  const a = audio(); if (!a) return;
  const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
}

const save = { best: 0, coins: 0, owned: ['amarelo'], selected: 'amarelo' };
try {
  const raw = JSON.parse(localStorage.getItem('flappy-save') || 'null');
  if (raw) Object.assign(save, raw);
  const legacyBest = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0;
  if (legacyBest > save.best) save.best = legacyBest;
} catch (e) {}
if (!save.owned.includes('amarelo')) save.owned.push('amarelo');
if (!BIRDS.some(b => b.id === save.selected)) save.selected = 'amarelo';
function persist() { try { localStorage.setItem('flappy-save', JSON.stringify(save)); } catch (e) {} }
function currentBird() { return BIRDS.find(b => b.id === save.selected) || BIRDS[0]; }

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------
let state = STATE.SPLASH;
let frames = 0;
let bird, pipes, score, groundX, deadTimer, panelY, flashAlpha, newBest;
let runCoins = 0;               // moedas pegas nesta partida
let pipeIndex = 0;              // quantos canos já foram criados nesta partida
let coinSlots = [];             // quais índices do bloco atual têm moeda
let shopMsg = null;             // aviso na loja ("moedas insuficientes")
let popups = [];                // "+1" flutuando ao pegar moeda

function resetBird() {
  bird = { x: BIRD_X, y: 220, vy: 0, rot: 0, frame: 0, animT: 0 };
}

function resetRun() { resetBird(); pipes = []; score = 0; groundX = 0; runCoins = 0; pipeIndex = 0; popups = []; }
function goSplash() { state = STATE.SPLASH; resetRun(); }
function goReady()  { state = STATE.READY; resetRun(); SFX.swoosh(); }
function goShop()   { state = STATE.SHOP; shopMsg = null; SFX.swoosh(); }

function goPlay() {
  state = STATE.PLAY;
  pipes = [];
  spawnPipe(FIRST_PIPE_X);
  flap();
}

// velocidade atual: fixa até 50 pontos, sobe linearmente até 100 e depois trava
function speed() {
  if (score <= SPEED_RAMP_START) return PIPE_SPEED;
  const t = Math.min(1, (score - SPEED_RAMP_START) / (SPEED_RAMP_END - SPEED_RAMP_START));
  return PIPE_SPEED + (PIPE_SPEED_MAX - PIPE_SPEED) * t;
}

// Sorteia, para cada bloco de 30 canos, 10 posições que terão moeda.
// Assim a média é sempre 10 a cada 30, mas nunca se sabe em qual cano vem.
function rollCoinSlots() {
  const idx = Array.from({ length: PIPES_PER_BLOCK }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  coinSlots = new Set(idx.slice(0, COINS_PER_BLOCK));
}

function spawnPipe(x) {
  const minTop = 60, maxTop = GROUND_Y - PIPE_GAP - 60;
  const top = Math.floor(minTop + Math.random() * (maxTop - minTop));
  if (pipeIndex % PIPES_PER_BLOCK === 0) rollCoinSlots();
  const hasCoin = coinSlots.has(pipeIndex % PIPES_PER_BLOCK);
  pipeIndex++;
  pipes.push({ x, top, passed: false, coin: hasCoin, coinTaken: false });
}

function flap() {
  bird.vy = FLAP;
  SFX.wing();
}

function die() {
  state = STATE.DEAD;
  deadTimer = 0;
  panelY = H;
  flashAlpha = 1;
  newBest = score > save.best;
  if (newBest) save.best = score;
  persist();
  SFX.hit();
  if (bird.y < GROUND_Y - BIRD_H) SFX.die();
}

// ---------------------------------------------------------------------------
// Layout de botões e loja (usado tanto para desenhar quanto para o toque)
// ---------------------------------------------------------------------------
const BTN_START = { x: W / 2 - 52, y: 310, w: 104, h: 34 };
const BTN_SHOP  = { x: W / 2 - 52, y: 352, w: 104, h: 34 };
const BTN_BACK  = { x: 8, y: 8, w: 64, h: 26 };
const SHOP_COLS = 3, SHOP_CELL_W = 88, SHOP_CELL_H = 86, SHOP_X0 = (W - SHOP_COLS * SHOP_CELL_W) / 2, SHOP_Y0 = 70;
function shopCell(i) {
  return { x: SHOP_X0 + (i % SHOP_COLS) * SHOP_CELL_W + 3, y: SHOP_Y0 + Math.floor(i / SHOP_COLS) * SHOP_CELL_H + 3, w: SHOP_CELL_W - 6, h: SHOP_CELL_H - 6 };
}
function inside(pt, r) { return pt && pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h; }

// ---------------------------------------------------------------------------
// Entrada
// ---------------------------------------------------------------------------
function input(pt) {
  audio();
  switch (state) {
    case STATE.SPLASH:
      if (inside(pt, BTN_SHOP)) goShop(); else goReady();
      break;
    case STATE.READY:  goPlay(); break;
    case STATE.PLAY:   flap(); break;
    case STATE.DEAD:
      if (deadTimer > 60) goSplash();
      break;
    case STATE.SHOP:
      if (!pt || inside(pt, BTN_BACK)) { goSplash(); break; }
      for (let i = 0; i < BIRDS.length; i++) {
        if (inside(pt, shopCell(i))) { shopTap(BIRDS[i]); break; }
      }
      break;
  }
}
function shopTap(def) {
  if (save.owned.includes(def.id)) {
    save.selected = def.id; persist(); SFX.swoosh(); shopMsg = null;
  } else if (save.coins >= def.price) {
    save.coins -= def.price; save.owned.push(def.id); save.selected = def.id; persist(); SFX.buy();
    shopMsg = { text: `${def.name} comprado!`, color: '#7be26a', t: 90 };
  } else {
    SFX.deny();
    shopMsg = { text: `Faltam ${def.price - save.coins} moedas`, color: '#ff6060', t: 90 };
  }
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); input(null); }
  if (e.code === 'Escape' && state === STATE.SHOP) goSplash();
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  input({ x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height });
});
window.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------------
// Atualização
// ---------------------------------------------------------------------------
function birdBox() { return { x: bird.x + 4, y: bird.y + 4, w: BIRD_W - 8, h: BIRD_H - 8 }; }

function collides() {
  const b = birdBox();
  if (b.y + b.h >= GROUND_Y) return true;
  for (const p of pipes) {
    if (b.x + b.w > p.x && b.x < p.x + PIPE_W) {
      if (b.y < p.top || b.y + b.h > p.top + PIPE_GAP) return true;
    }
  }
  return false;
}

function coinPos(p) { return { x: p.x + PIPE_W / 2, y: p.top + PIPE_GAP / 2 }; }

function collectCoins() {
  const b = birdBox();
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    const nx = Math.max(b.x, Math.min(c.x, b.x + b.w)), ny = Math.max(b.y, Math.min(c.y, b.y + b.h));
    if ((nx - c.x) ** 2 + (ny - c.y) ** 2 <= COIN_R * COIN_R) {
      p.coinTaken = true; runCoins++; save.coins++;
      popups.push({ x: c.x, y: c.y, t: 40 });
      SFX.coin();
    }
  }
}

function updateBirdPhysics() {
  bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
  bird.y += bird.vy;
  if (bird.y < -BIRD_H) { bird.y = -BIRD_H; bird.vy = 0; }
  if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
  const target = bird.vy < 0 ? -0.45 : Math.min(Math.PI / 2, (bird.vy - 1) * 0.22);
  bird.rot = bird.vy < 0 ? target : Math.min(target, bird.rot + 0.06);
  if (bird.vy < 0) bird.rot = -0.45;
}

function animateBird(speed) {
  bird.animT++;
  if (bird.animT >= speed) { bird.animT = 0; bird.frame = (bird.frame + 1) % 4; }
}

function update() {
  frames++;
  for (const q of popups) { q.t--; q.y -= 0.6; }
  popups = popups.filter(q => q.t > 0);
  if (shopMsg && --shopMsg.t <= 0) shopMsg = null;

  switch (state) {
    case STATE.SPLASH:
    case STATE.READY:
    case STATE.SHOP:
      groundX = (groundX - PIPE_SPEED) % GROUND_TILE_W;
      bird.y = 220 + Math.sin(frames / 8) * 5;
      bird.rot = 0;
      animateBird(6);
      break;

    case STATE.PLAY: {
      const v = speed();
      groundX = (groundX - v) % GROUND_TILE_W;
      animateBird(4);
      updateBirdPhysics();
      for (const p of pipes) {
        p.x -= v;
        if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; SFX.point(); }
      }
      if (pipes.length && pipes[0].x < -PIPE_CAP_W) pipes.shift();
      if (pipes[pipes.length - 1].x <= W - PIPE_SPACING + PIPE_W) spawnPipe(pipes[pipes.length - 1].x + PIPE_SPACING);
      collectCoins();
      if (collides()) die();
      break;
    }

    case STATE.DEAD:
      deadTimer++;
      flashAlpha = Math.max(0, flashAlpha - 0.08);
      if (bird.y < GROUND_Y - BIRD_H) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL);
        bird.y += bird.vy;
        if (bird.y > GROUND_Y - BIRD_H) bird.y = GROUND_Y - BIRD_H;
        bird.rot = Math.min(Math.PI / 2, bird.rot + 0.12);
      }
      if (deadTimer > 30) panelY = Math.max(H / 2 - 130, panelY - 14);
      break;
  }
}

// ---------------------------------------------------------------------------
// Desenho
// ---------------------------------------------------------------------------
function drawPipes() {
  for (const p of pipes) {
    const x = Math.round(p.x);
    for (let y = p.top - PIPE_CAP_H - 8; y > -8; y -= 8) ctx.drawImage(PIPE_BODY, x, y);
    ctx.drawImage(PIPE_CAP, x - 2, p.top - PIPE_CAP_H);
    const bottom = p.top + PIPE_GAP;
    ctx.drawImage(PIPE_CAP, x - 2, bottom);
    for (let y = bottom + PIPE_CAP_H; y < GROUND_Y; y += 8) ctx.drawImage(PIPE_BODY, x, y, PIPE_W, Math.min(8, GROUND_Y - y));
  }
}

function drawCoin(x, y, big = false, spin = false) {
  const f = spin ? COIN_FRAMES[Math.floor(frames / 6) % 4] : COIN_FRAMES[0];
  if (big) ctx.drawImage(f, Math.round(x - 8), Math.round(y - 8));
  else ctx.drawImage(f, 0, 0, 16, 16, Math.round(x - 6), Math.round(y - 6), 12, 12);
}

function drawCoins() {
  for (const p of pipes) {
    if (!p.coin || p.coinTaken) continue;
    const c = coinPos(p);
    drawCoin(c.x, c.y + Math.sin(frames / 10) * 2, true, true);
  }
  for (const q of popups) pixelText('+1', q.x, q.y - 14, 11, '#ffe060', '#543847');
}

function drawBird(def = currentBird(), b = bird) {
  const f = [0, 1, 2, 1][b.frame];
  ctx.save();
  ctx.translate(Math.round(b.x + BIRD_W / 2), Math.round(b.y + BIRD_H / 2));
  ctx.rotate(b.rot);
  ctx.drawImage(birdSprite(def, f), -BIRD_W / 2, -BIRD_H / 2);
  ctx.restore();
}

function drawGround() { ctx.drawImage(GROUND, Math.round(groundX), GROUND_Y); }

function drawTapHint(x, y) {
  ctx.fillStyle = '#543847';
  ctx.fillRect(x - 2, y - 26, 4, 10); ctx.fillRect(x - 6, y - 22, 12, 3);
  ctx.fillRect(x - 2, y + 16, 4, 10); ctx.fillRect(x - 6, y + 19, 12, 3);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#543847'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x - 9, y - 8, 18, 22, 5); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(x - 5, y - 16, 7, 14, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#543847';
  ctx.fillRect(x - 24, y - 4, 10, 3); ctx.fillRect(x + 14, y - 4, 10, 3);
}

function drawButton(r, label, color = '#f5a623', light = '#fbd36b', dark = '#c47e12', size = 14) {
  ctx.fillStyle = '#543847'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = color; ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
  ctx.fillStyle = light; ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, 4);
  ctx.fillStyle = dark; ctx.fillRect(r.x + 2, r.y + r.h - 6, r.w - 4, 4);
  pixelText(label, r.x + r.w / 2, r.y + (r.h - size) / 2 - 1, size, '#ffffff', '#543847');
}

// saldo de moedas no canto superior esquerdo
function drawCoinHud(x, y, n) {
  drawCoin(x + 6, y + 6, true);
  drawNumber(n, x + 18, y + 1, smallDigits, SMALL_DW, 'left');
}

function drawShop() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  drawButton(BTN_BACK, 'VOLTAR', '#6aa8ff', '#a8ccff', '#3a70c0', 11);
  pixelText('LOJA', W / 2, 10, 22, '#ffffff', '#543847');
  drawCoinHud(W - 74, 14, save.coins);

  for (let i = 0; i < BIRDS.length; i++) {
    const def = BIRDS[i], r = shopCell(i), rar = RARITY[def.rarity];
    const owned = save.owned.includes(def.id), sel = save.selected === def.id;
    // moldura na cor da raridade; selecionado ganha borda branca
    ctx.fillStyle = sel ? '#ffffff' : '#543847'; ctx.fillRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4);
    ctx.fillStyle = rar.color; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = owned ? '#f5f0c0' : '#ded895'; ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
    pixelText(rar.label, r.x + r.w / 2, r.y + 5, 8, rar.color, '#543847');
    const preview = { x: r.x + r.w / 2 - BIRD_W / 2, y: r.y + 20 + (sel ? Math.sin(frames / 8) * 2 : 0), rot: 0, frame: bird.frame };
    if (!owned) ctx.globalAlpha = 0.55;
    drawBird(def, preview);
    ctx.globalAlpha = 1;
    pixelText(def.name, r.x + r.w / 2, r.y + 47, 10, '#543847', '#f5f0c0');
    if (sel) pixelText('EM USO', r.x + r.w / 2, r.y + 63, 9, '#ffffff', '#3a9a2a');
    else if (owned) pixelText('USAR', r.x + r.w / 2, r.y + 63, 9, '#ffffff', '#543847');
    else {
      drawCoin(r.x + r.w / 2 - 16, r.y + 69, false);
      pixelText(String(def.price), r.x + r.w / 2 - 6, r.y + 63, 10, save.coins >= def.price ? '#ffe060' : '#ff9090', '#543847', 'left');
    }
  }
  if (shopMsg) {
    ctx.globalAlpha = Math.min(1, shopMsg.t / 20);
    pixelText(shopMsg.text, W / 2, H - 60, 13, shopMsg.color, '#543847');
    ctx.globalAlpha = 1;
  }
  pixelText('Pegue moedas nos canos para comprar', W / 2, H - 36, 9, '#ffffff', '#543847');
}

function draw() {
  ctx.drawImage(BG, 0, 0);

  if (state === STATE.SPLASH) {
    drawGround();
    pixelText('Flappy Bird', W / 2, 110, 34, '#ffffff', '#543847');
    ctx.save(); ctx.translate(0, -20); drawBird(); ctx.restore();
    drawButton(BTN_START, 'START');
    drawButton(BTN_SHOP, 'LOJA', '#6aa8ff', '#a8ccff', '#3a70c0');
    drawCoinHud(10, 10, save.coins);
    if (save.best > 0) {
      pixelText('RECORDE', W / 2, 50, 12, '#ffffff', '#543847');
      drawNumber(save.best, W / 2, 66, smallDigits, SMALL_DW);
    }
    return;
  }

  if (state === STATE.SHOP) { drawGround(); drawShop(); return; }

  drawPipes();
  drawCoins();
  drawGround();
  drawBird();

  if (state === STATE.READY) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
    pixelText('Prepare-se!', W / 2, 130, 30, '#7be26a', '#543847');
    drawTapHint(W / 2, 250);
    pixelText('TOQUE', W / 2 + 40, 236, 12, '#ffffff', '#543847');
  }

  if (state === STATE.PLAY) {
    drawNumber(score, W / 2, 50, bigDigits, BIG_DW);
    drawCoinHud(10, 10, save.coins);
  }

  if (state === STATE.DEAD) {
    if (deadTimer > 30) {
      pixelText('Fim de jogo', W / 2, panelY - 60, 30, '#f5a623', '#543847');
      const px = W / 2 - 113, py = panelY;
      panel(px, py, 226, 140);
      pixelText('MEDALHA', px + 60, py + 12, 12, '#f5a623', '#543847');
      pixelText('PLACAR', px + 176, py + 12, 12, '#f5a623', '#543847');
      drawNumber(score, px + 206, py + 30, bigDigits, BIG_DW, 'right');
      pixelText('RECORDE', px + 176, py + 62, 12, '#f5a623', '#543847');
      drawNumber(save.best, px + 206, py + 80, bigDigits, BIG_DW, 'right');
      if (newBest && score > 0) {
        ctx.fillStyle = '#e04020'; ctx.fillRect(px + 128, py + 66, 30, 12);
        pixelText('NOVO', px + 143, py + 66, 9, '#ffffff', '#e04020');
      }
      const kind = score >= 40 ? 'platinum' : score >= 30 ? 'gold' : score >= 20 ? 'silver' : score >= 10 ? 'bronze' : null;
      if (kind) medal(px + 60, py + 68, kind);
      else { ctx.fillStyle = '#c9b87a'; ctx.beginPath(); ctx.arc(px + 60, py + 68, 23, 0, Math.PI * 2); ctx.fill(); }
      // moedas da partida
      pixelText('MOEDAS', px + 60, py + 104, 12, '#f5a623', '#543847');
      drawCoin(px + 120, py + 114, true);
      pixelText('+' + runCoins, px + 132, py + 106, 14, '#ffffff', '#543847', 'left');
      pixelText('total ' + save.coins, px + 206, py + 110, 9, '#543847', '#f5f0c0', 'right');
      if (deadTimer > 60) drawButton({ x: W / 2 - 52, y: panelY + 158, w: 104, h: 34 }, 'OK');
    }
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

// ---------------------------------------------------------------------------
// Loop a 60 FPS fixos (passo de tempo fixo, independente do refresh da tela)
// ---------------------------------------------------------------------------
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  let scale = Math.min(sw / W, sh / H);
  if (scale >= 1) scale = Math.floor(scale * 2) / 2;
  canvas.style.width = `${Math.floor(W * scale)}px`;
  canvas.style.height = `${Math.floor(H * scale)}px`;
}
window.addEventListener('resize', resize);
resize();

goSplash();
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
